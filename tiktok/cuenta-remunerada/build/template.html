<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Poppins;src:url(poppins-bold.ttf) format('truetype');font-weight:700}
@font-face{font-family:Archivo;src:url(archivo.woff2) format('woff2');font-weight:100 900;font-stretch:62% 125%}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#world{position:absolute;left:0;top:0}
#subs{position:absolute;left:60px;right:60px;top:560px;text-align:center;font-family:Poppins;font-weight:700;font-size:66px;line-height:1.1;color:#fff;letter-spacing:-.5px;
 paint-order:stroke fill;-webkit-text-stroke:9px #1d1a17;text-shadow:0 5px 14px rgba(0,0,0,.45);transform-origin:50% 50%}
#cta{position:absolute;left:50%;top:1640px;transform:translateX(-50%);font-family:Poppins;font-weight:700;font-size:52px;color:#fff;background:#50519E;border:6px solid #1d1a17;border-radius:100px;padding:14px 46px;opacity:0;white-space:nowrap}
#disc{position:absolute;left:0;right:0;bottom:28px;text-align:center;font-family:Poppins;font-size:24px;color:rgba(255,255,255,.85);text-shadow:0 2px 6px rgba(0,0,0,.6)}
</style></head><body>
<svg id="world" width="1080" height="1920" viewBox="0 0 1080 1920">
 <defs>
  <linearGradient id="gWin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd27a"/><stop offset="1" stop-color="#ff8f3d"/></linearGradient>
  <linearGradient id="gCeil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a2a20"/><stop offset="1" stop-color="#8a735c"/></linearGradient>
  <linearGradient id="gSeat" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d9c7a6"/><stop offset=".5" stop-color="#efe3c9"/><stop offset="1" stop-color="#d4c09d"/></linearGradient>
  <linearGradient id="gSteel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d7dade"/><stop offset=".5" stop-color="#a9aeb5"/><stop offset="1" stop-color="#7d838b"/></linearGradient>
  <linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fd3f0"/><stop offset="1" stop-color="#f7e7c6"/></linearGradient>
  <linearGradient id="gSea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3fa3c4"/><stop offset="1" stop-color="#1f6f96"/></linearGradient>
  <linearGradient id="gScreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d2b4a"/><stop offset="1" stop-color="#0f1729"/></linearGradient>
  <radialGradient id="gVig" cx=".5" cy=".5" r=".75"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></radialGradient>
  <linearGradient id="shF" x1="0" y1="0" x2="1" y2=".35"><stop offset=".42" stop-color="#7a3b1c" stop-opacity="0"/><stop offset="1" stop-color="#7a3b1c" stop-opacity=".42"/></linearGradient>
  <linearGradient id="shB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".4" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".42"/></linearGradient>
  <radialGradient id="ao"><stop offset="0" stop-color="#000" stop-opacity=".5"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  <linearGradient id="shaft" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd59a" stop-opacity=".5"/><stop offset="1" stop-color="#ffd59a" stop-opacity="0"/></linearGradient>
  <radialGradient id="glow" cx=".5" cy=".12" r=".85"><stop offset="0" stop-color="#ffd08f" stop-opacity=".25"/><stop offset="1" stop-color="#ffd08f" stop-opacity="0"/></radialGradient>
  <filter id="dof" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="4.5"/></filter>
  <filter id="dof2" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="2"/></filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="7"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .45  0 0 0 0 .4  0 0 0 .09 0"/></filter>
 <clipPath id="cL"><rect x="0" y="0" width="538" height="1920"/></clipPath>
  <clipPath id="cR"><rect x="542" y="0" width="538" height="1920"/></clipPath>
 </defs>
 <g id="cam"></g>
 <rect width="1080" height="1920" fill="url(#glow)"/>
 <rect width="1080" height="1920" fill="url(#gVig)"/>
 <rect width="1080" height="1920" filter="url(#grain)" opacity=".9"/>
</svg>
<div id="subs"></div>
<div id="cta">+ Sígueme</div>
<div id="disc"></div>

<script src="subs.js"></script>
<script>
const $=id=>document.getElementById(id);
const cl=x=>Math.max(0,Math.min(1,x));
const eo=x=>1-Math.pow(1-cl(x),3);
const eio=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const eback=x=>{x=cl(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const fmt=n=>Math.round(n).toLocaleString('es-ES').replace(/,/g,'.');
const D=DATA, W=D.words, SC=D.scenes;
const OL='#1d1a17';
const clean=w=>w.replace(/[.,!?¿¡…:]/g,'');
const norm=w=>clean(w).toLowerCase();
const L=i=>SC[i].s, LE=i=>SC[i].e;
function T(word,after=0){for(const w of W){if(w.s>=after-0.01&&norm(w.w).startsWith(word))return w.s}return after}
function talking(who,t){for(const w of W){if(w.who===who&&t>=w.s-0.02&&t<=w.e+0.02)return true;if(w.s>t+1)break}return false}
function lineAt(t){let k=0;SC.forEach((s,i)=>{if(t>=s.s-0.05)k=i});return k}

// ================= primitivas =================
const P=a=>'M'+a.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L');
function limb(pts,w,fill){const d=P(pts);return `<path d="${d}" stroke="${OL}" stroke-width="${w+12}" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" stroke="${fill}" stroke-width="${w}" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" transform="translate(${w*0.2} 2)" stroke="#000" stroke-opacity=".2" stroke-width="${w*0.45}" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" transform="translate(${-w*0.22} 0)" stroke="#fff" stroke-opacity=".12" stroke-width="${w*0.22}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`}
const txt=(x,y,s,c,str,anchor='middle',w=800,font='Poppins')=>`<text x="${x}" y="${y}" font-family="${font}" font-weight="${w}" font-size="${s}" fill="${c}" text-anchor="${anchor}">${str}</text>`;

// ---------- caras (diseño original, coords 520x1000) ----------
function faceR(m,blink,sun){
  const skin='#f1c7a0',SK=OL;
  const mouth=m>0.1
   ?`<path d="M222 478 Q262 472 302 476 Q292 ${490+28*m} 260 ${495+30*m} Q230 ${490+28*m} 222 478 Z" fill="#5a1a1a" stroke="${SK}" stroke-width="6"/>`
   :`<path d="M215 485 Q262 500 304 474" stroke="${SK}" stroke-width="7" fill="none" stroke-linecap="round"/>`;
  const eyes=sun?`<path d="M160 360 L360 360 L350 400 Q330 420 290 410 L270 380 L250 380 L230 410 Q190 420 170 400 Z" fill="#141414" stroke="${SK}" stroke-width="5"/><path d="M180 372 L215 372" stroke="#555" stroke-width="5"/>`
   :(blink?`<path d="M176 384 L234 384 M286 384 L344 384" stroke="${SK}" stroke-width="6"/>`
   :`<ellipse cx="205" cy="382" rx="27" ry="19" fill="#fff" stroke="${SK}" stroke-width="5"/><ellipse cx="315" cy="382" rx="27" ry="19" fill="#fff" stroke="${SK}" stroke-width="5"/><circle cx="210" cy="385" r="9" fill="${SK}"/><circle cx="320" cy="385" r="9" fill="${SK}"/><path d="M176 382 Q205 352 234 382 L234 372 Q205 356 176 372Z" fill="${skin}"/><path d="M286 382 Q315 352 344 382 L344 372 Q315 356 286 372Z" fill="${skin}"/><path d="M178 376 Q205 366 232 376 M288 376 Q315 366 342 376" stroke="${SK}" stroke-width="6" fill="none"/>
     <rect x="166" y="352" width="80" height="60" rx="16" fill="none" stroke="#222" stroke-width="5"/><rect x="274" y="352" width="80" height="60" rx="16" fill="none" stroke="#222" stroke-width="5"/><path d="M246 374 L274 374" stroke="#222" stroke-width="5"/>`);
  return `<g stroke-linejoin="round" stroke-linecap="round">
  <ellipse cx="140" cy="410" rx="24" ry="36" fill="${skin}" stroke="${SK}" stroke-width="7"/><ellipse cx="380" cy="410" rx="24" ry="36" fill="${skin}" stroke="${SK}" stroke-width="7"/>
  <path d="M142 360 Q142 230 260 230 Q378 230 378 360 L372 455 Q358 548 260 552 Q162 548 148 455 Z" fill="${skin}" stroke="${SK}" stroke-width="7"/><path d="M142 360 Q142 230 260 230 Q378 230 378 360 L372 455 Q358 548 260 552 Q162 548 148 455 Z" fill="url(#shF)"/><ellipse cx="225" cy="300" rx="55" ry="24" fill="#fff" opacity=".2"/><path d="M190 470 Q262 540 330 470" stroke="#b5643c" stroke-opacity=".18" stroke-width="16" fill="none"/>
  <path d="M136 365 Q118 215 262 198 Q404 214 384 365 Q372 292 330 272 Q262 250 192 276 Q150 296 136 365 Z" fill="#4b3020" stroke="${SK}" stroke-width="7"/>
  <path d="M200 240 Q262 220 330 238" stroke="#8f6646" stroke-width="10" fill="none"/><path d="M180 270 Q230 245 280 252" stroke="#a37a58" stroke-width="6" fill="none" opacity=".7"/>
  ${eyes}
  <path d="M172 338 Q205 322 238 336" stroke="#3a2416" stroke-width="11" fill="none"/><path d="M284 332 Q318 318 350 340" stroke="#3a2416" stroke-width="11" fill="none"/>
  <path d="M262 398 Q248 440 262 452 Q276 455 284 446" stroke="${SK}" stroke-width="6" fill="none"/>
  <path d="M190 470 Q198 488 212 494" stroke="#d9a07c" stroke-width="5" fill="none"/>
  ${mouth}</g>`;
}
function faceD(m,blink,expr){
  const skin='#f6d2b0',SK=OL,big=expr==='shock',er=big?36:30,pr=big?8:12;
  let mouth;
  if(expr==='shock') mouth=`<ellipse cx="262" cy="${492+6*m}" rx="${22+6*m}" ry="${26+12*m}" fill="#5a1a1a" stroke="${SK}" stroke-width="6"/>`;
  else if(m>0.1) mouth=`<path d="M232 482 Q262 478 292 482 Q284 ${496+26*m} 262 ${500+28*m} Q240 ${496+26*m} 232 482 Z" fill="#5a1a1a" stroke="${SK}" stroke-width="6"/>`;
  else if(expr==='proud') mouth=`<path d="M228 478 Q262 506 296 478" stroke="${SK}" stroke-width="7" fill="none"/>`;
  else if(expr==='worry'||expr==='confused') mouth=`<path d="M236 494 Q262 480 288 494" stroke="${SK}" stroke-width="7" fill="none"/>`;
  else mouth=`<path d="M238 484 Q262 494 286 484" stroke="${SK}" stroke-width="7" fill="none"/>`;
  const B=(a,b)=>`<path d="${a}" stroke="#a07a2a" stroke-width="10" fill="none"/><path d="${b}" stroke="#a07a2a" stroke-width="10" fill="none"/>`;
  const brows=expr==='worry'?B('M180 330 Q205 314 238 318','M286 318 Q318 314 344 330'):expr==='confused'?B('M180 322 Q208 308 238 324','M286 338 Q318 334 344 340'):expr==='shock'?B('M180 312 Q208 290 238 306','M286 306 Q316 290 344 312'):B('M182 330 Q208 318 236 326','M288 326 Q316 318 342 330');
  const eyes=blink?`<path d="M${215-er} 385 L${215+er} 385 M${305-er} 385 L${305+er} 385" stroke="${SK}" stroke-width="7"/>`
   :`<circle cx="215" cy="385" r="${er}" fill="#fff" stroke="${SK}" stroke-width="6"/><circle cx="305" cy="385" r="${er}" fill="#fff" stroke="${SK}" stroke-width="6"/><circle cx="220" cy="388" r="${pr}" fill="${SK}"/><circle cx="300" cy="388" r="${pr}" fill="${SK}"/>`;
  const sweat=expr==='worry'?`<path d="M392 300 Q404 330 392 342 Q380 330 392 300 Z" fill="#9fd8ff" stroke="${SK}" stroke-width="4"/>`:'';
  return `<g stroke-linejoin="round" stroke-linecap="round">
  <ellipse cx="150" cy="400" rx="22" ry="32" fill="${skin}" stroke="${SK}" stroke-width="7"/><ellipse cx="374" cy="400" rx="22" ry="32" fill="${skin}" stroke="${SK}" stroke-width="7"/>
  <path d="M152 380 Q152 250 262 245 Q372 250 372 380 Q372 520 262 558 Q152 520 152 380 Z" fill="${skin}" stroke="${SK}" stroke-width="7"/><path d="M152 380 Q152 250 262 245 Q372 250 372 380 Q372 520 262 558 Q152 520 152 380 Z" fill="url(#shF)"/><ellipse cx="225" cy="300" rx="55" ry="24" fill="#fff" opacity=".2"/><path d="M190 470 Q262 540 330 470" stroke="#b5643c" stroke-opacity=".18" stroke-width="16" fill="none"/>
  <path d="M146 372 Q130 236 222 214 L232 182 L258 212 L284 180 L298 216 Q392 230 378 372 Q362 300 322 286 L302 302 L282 282 L258 304 L232 284 L202 302 Q162 312 146 372 Z" fill="#e2b84f" stroke="${SK}" stroke-width="7"/><path d="M190 250 Q240 225 300 240" stroke="#f6dc8e" stroke-width="12" fill="none"/><path d="M320 300 Q360 320 372 365" stroke="#b48a2e" stroke-width="14" fill="none" opacity=".6"/>
  ${brows}${eyes}
  <path d="M262 410 Q254 438 266 446" stroke="${SK}" stroke-width="6" fill="none"/>
  ${mouth}${sweat}</g>`;
}
function faceB(m,blink){ // banquero: calvo, bigote, mofletes
  const skin='#efbf9a',SK=OL;
  const mouth=m>0.1?`<ellipse cx="262" cy="${505+6*m}" rx="${28}" ry="${10+16*m}" fill="#5a1a1a" stroke="${SK}" stroke-width="6"/>`:`<path d="M234 506 Q262 520 290 506" stroke="${SK}" stroke-width="7" fill="none"/>`;
  return `<g stroke-linejoin="round" stroke-linecap="round">
  <ellipse cx="128" cy="410" rx="26" ry="36" fill="${skin}" stroke="${SK}" stroke-width="7"/><ellipse cx="396" cy="410" rx="26" ry="36" fill="${skin}" stroke="${SK}" stroke-width="7"/>
  <path d="M135 380 Q135 230 262 225 Q389 230 389 380 Q392 540 262 565 Q132 540 135 380 Z" fill="${skin}" stroke="${SK}" stroke-width="7"/><path d="M135 380 Q135 230 262 225 Q389 230 389 380 Q392 540 262 565 Q132 540 135 380 Z" fill="url(#shF)"/><ellipse cx="225" cy="300" rx="55" ry="24" fill="#fff" opacity=".2"/><path d="M190 470 Q262 540 330 470" stroke="#b5643c" stroke-opacity=".18" stroke-width="16" fill="none"/>
  <path d="M135 390 Q130 320 160 300 Q150 350 165 380 Z M389 390 Q394 320 364 300 Q374 350 359 380 Z" fill="#cfcfcf" stroke="${SK}" stroke-width="5"/>
  ${blink?`<path d="M190 385 L240 385 M284 385 L334 385" stroke="${SK}" stroke-width="7"/>`:`<ellipse cx="215" cy="385" rx="22" ry="16" fill="#fff" stroke="${SK}" stroke-width="5"/><ellipse cx="309" cy="385" rx="22" ry="16" fill="#fff" stroke="${SK}" stroke-width="5"/><circle cx="218" cy="387" r="8" fill="${SK}"/><circle cx="306" cy="387" r="8" fill="${SK}"/>`}
  <path d="M188 350 Q215 338 242 350 M282 350 Q309 338 336 350" stroke="#9a9a9a" stroke-width="10" fill="none"/>
  <path d="M262 400 Q245 445 262 458 Q282 460 288 450" stroke="${SK}" stroke-width="6" fill="none"/>
  <circle cx="180" cy="460" r="22" fill="#f2a08a" opacity=".6"/><circle cx="344" cy="460" r="22" fill="#f2a08a" opacity=".6"/>
  <path d="M208 485 Q236 466 262 480 Q288 466 316 485 Q300 498 262 490 Q224 498 208 485 Z" fill="#8f8f8f" stroke="${SK}" stroke-width="5"/>
  ${mouth}</g>`;
}

// ---------- props ----------
function piggy(x,y,s,fire,t){
  let f='';
  if(fire>0){const fl=Math.sin(t*28)*0.08;f=`<g opacity="${fire}" transform="translate(${x} ${y-50}) scale(${s*0.8*(1+fl)} ${s*0.8*(1-fl)*fire})"><path d="M-95 0 Q-110 -70 -70 -110 Q-62 -60 -40 -55 Q-40 -120 0 -150 Q0 -90 30 -70 Q45 -120 80 -125 Q70 -70 95 -40 Q110 -20 95 0 Z" fill="#F25244" stroke="${OL}" stroke-width="6"/><path d="M-60 0 Q-70 -50 -40 -70 Q-32 -40 -12 -38 Q-5 -85 22 -95 Q22 -55 45 -45 Q60 -70 72 -70 Q68 -30 70 0 Z" fill="#F2983E"/><path d="M-30 0 Q-30 -30 -10 -40 Q0 -20 15 -22 Q25 -40 35 -40 Q35 -15 40 0 Z" fill="#FFD23F"/></g>`}
  return `<g transform="translate(${x} ${y}) scale(${s})" stroke="${OL}" stroke-width="6" stroke-linejoin="round">
   <rect x="-70" y="40" width="26" height="40" rx="8" fill="#f2a5b8"/><rect x="40" y="40" width="26" height="40" rx="8" fill="#f2a5b8"/>
   <ellipse cx="0" cy="0" rx="105" ry="78" fill="#f7b6c6"/><path d="M-50 -65 L-62 -105 L-20 -78 Z" fill="#f2a5b8"/>
   <ellipse cx="-102" cy="8" rx="26" ry="30" fill="#f2a5b8"/><circle cx="-108" cy="2" r="5" fill="${OL}"/><circle cx="-98" cy="16" r="5" fill="${OL}"/>
   <circle cx="-55" cy="-18" r="7" fill="${OL}" stroke="none"/><rect x="-20" y="-80" width="44" height="10" rx="5" fill="${OL}"/>
   <path d="M100 0 Q125 -10 118 -28" fill="none"/>
   <text x="10" y="32" font-family="Poppins" font-size="34" fill="#9b3c55" stroke="none" text-anchor="middle">20.000 €</text></g>${f}`;
}
function glass(x,y,s){return `<g transform="translate(${x} ${y}) scale(${s})" stroke="${OL}" stroke-width="5"><path d="M-26 -50 L26 -50 L22 10 L-22 10 Z" fill="#dff1f7" opacity=".9"/><path d="M-24 -18 L24 -18 L22 10 L-22 10 Z" fill="#d68a2c"/><rect x="-12" y="-36" width="18" height="16" fill="#fff" opacity=".8" stroke-width="3"/></g>`}
function cup(x,y,s){return `<g transform="translate(${x} ${y}) scale(${s})" stroke="${OL}" stroke-width="5"><ellipse cx="0" cy="12" rx="44" ry="10" fill="#fff"/><path d="M-26 -30 L26 -30 L20 8 L-20 8 Z" fill="#fff"/><path d="M26 -20 Q44 -18 40 -4 Q38 6 22 2" fill="none"/></g>`}
function phone(x,y,s,lines){let tl='';lines.forEach((l,i)=>tl+=`<text x="0" y="${-50+i*44}" font-family="Poppins" font-size="${l[2]||30}" fill="${l[1]}" text-anchor="middle" stroke="none">${l[0]}</text>`);
 return `<g transform="translate(${x} ${y}) scale(${s})" stroke="${OL}" stroke-width="6"><rect x="-80" y="-140" width="160" height="280" rx="24" fill="#222"/><rect x="-68" y="-122" width="136" height="244" rx="12" fill="#fff" stroke-width="3"/>${tl}</g>`}
function paper(x,y,s,rot,body){return `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${s})" stroke="${OL}" stroke-width="6"><rect x="-150" y="-200" width="300" height="400" rx="10" fill="#fffdf6"/><g stroke="none">${body}</g></g>`}
function cash(x,y,s,n){let g='';for(let i=0;i<n;i++){const dx=(i%3)*58-58,dy=-Math.floor(i/3)*30;g+=`<g transform="translate(${dx} ${dy})"><rect x="-50" y="-26" width="100" height="40" rx="4" fill="#8fc79a" stroke="${OL}" stroke-width="5"/><rect x="-50" y="-12" width="100" height="10" fill="#cfa85a" stroke="${OL}" stroke-width="3"/></g>`}return `<g transform="translate(${x} ${y}) scale(${s})">${g}</g>`}
function stack(x,y,h){return `<g stroke="${OL}" stroke-width="5"><rect x="${x-48}" y="${y-h}" width="96" height="${h}" fill="#8fc79a"/>${Array.from({length:Math.max(1,Math.floor(h/22))},(_,i)=>`<line x1="${x-48}" y1="${y-i*22}" x2="${x+48}" y2="${y-i*22}" stroke-width="3"/>`).join('')}<rect x="${x-48}" y="${y-h*0.6-8}" width="96" height="14" fill="#cfa85a" stroke-width="4"/></g>`}

// ---------- personaje de cuerpo entero ----------
// o:{who:'R'|'D'|'B', x,y (pies), s, pose:'stand'|'sit', arms:'down'|'lap'|'rest'|'holdR'|'point'|'eat'|'stamp', expr, m, blink, sun, hold:svg-fn(hx,hy)}
function person(o){
  const sit=o.pose==='sit', dy=sit?110:0, S=-640+dy, H=-400+dy;
  const look={
   R:{top:o.summer?'#f4f4f0':'#23305a',pants:o.summer?'#e9dfc8':'#1f2a4d',shoe:'#1b1b1b',skin:'#f1c7a0'},
   D:{top:'#3b4a3f',pants:'#3d5a8a',shoe:'#f2f2f2',skin:'#f6d2b0'},
   B:{top:'#5f6670',pants:'#4d535c',shoe:'#5b3a22',skin:'#efbf9a'}}[o.who];
  let g='';
  g+=`<ellipse cx="0" cy="-4" rx="${sit?210:150}" ry="30" fill="url(#ao)"/>`;
  // piernas
  const lx=o.who==='B'?50:40;
  const legsS=[[[-lx,H],[-lx-4,-200],[-lx-6,-34]],[[lx,H],[lx+4,-200],[lx+6,-34]]];
  const legsC=[[[-lx,H-10],[-lx-26,-250],[-lx-28,-34]],[[lx,H-10],[lx+26,-250],[lx+28,-34]]];
  const legs=sit?legsC:legsS;
  if(!o.noLegs){
   legs.forEach(l=>g+=limb(l,66,look.pants));
   if(sit) g+=`<path d="M${-lx-50} ${H-20} Q0 ${H+40} ${lx+50} ${H-20} L${lx+60} -250 Q0 -210 ${-lx-60} -250 Z" fill="${look.pants}" stroke="${OL}" stroke-width="6"/>`;
   const fx=sit?lx+28:lx+6;
   g+=`<ellipse cx="${-fx-6}" cy="-16" rx="50" ry="22" fill="${look.shoe}" stroke="${OL}" stroke-width="6"/><ellipse cx="${fx+6}" cy="-16" rx="50" ry="22" fill="${look.shoe}" stroke="${OL}" stroke-width="6"/>`;
   if(o.who==='D') g+=`<path d="M${-fx-50} -10 L${-fx+38} -10 M${fx-38} -10 L${fx+50} -10" stroke="#c9c9c9" stroke-width="6"/>`;
  }
  // torso
  const bw=o.who==='B'?150:105, ww=o.who==='B'?140:88;
  const belly=o.who==='B'?`Q${bw+40} ${(S+H)/2+40} ${ww} ${H}`:`L${ww} ${H}`;
  const bellyL=o.who==='B'?`Q${-bw-40} ${(S+H)/2+40} ${-bw} ${S+40}`:`L${-bw} ${S+30}`;
  const torso=`M${-bw} ${S+30} Q${-bw+5} ${S} ${-60} ${S-10} L60 ${S-10} Q${bw-5} ${S} ${bw} ${S+30} ${belly} L${-ww} ${H} ${bellyL} Z`;
  g+=`<path d="${torso}" fill="${look.top}" stroke="${OL}" stroke-width="6" stroke-linejoin="round"/>`;
  const shadeTorso=`<path d="${torso}" fill="url(#shB)"/>`;
