  return t=>{rs.forEach((e,i)=>{const a=S.rows[i].a;const k=eo(p(t,a,.35));e.style.opacity=k;e.style.transform=`translateX(${(1-k)*300}px)`;if(i===rs.length-1)shake(t,a,.3,18)})}};

/* ---------- CTA ---------- */
B.cta=(S,root)=>{chrome(S,root);
  const h=mk(root,'abs cond',`left:60px;right:60px;top:320px;font-size:${S.hs||130}px;line-height:.95`,S.title);
  const bub=mk(root,'card',`left:70px;right:150px;top:${S.by||760}px;height:190px;border-radius:44px;padding:0 50px;display:flex;align-items:center;gap:26px`,
    `<div style="width:80px;height:80px;border-radius:50%;background:${C.y};flex:none"></div><div class="cond" style="font-size:62px;color:${C.paper};white-space:nowrap" id="tp"></div><div id="cr" style="width:6px;height:72px;background:${C.y};margin-left:-14px"></div>`);
  const sub=mk(root,'abs cond',`left:60px;right:150px;top:${(S.by||760)+250}px;font-size:56px;color:${C.y}`,S.sub||'');
  const tp=bub.querySelector('#tp'),cr=bub.querySelector('#cr');
  return t=>{rise(h,t,S.a);const k=eo(p(t,S.a+.4,.4));bub.style.opacity=k;bub.style.transform=`translateY(${(1-k)*80}px)`;
    const n=Math.floor(cl((t-S.typeA)/S.typeD)*S.text.length);tp.textContent=S.text.slice(0,n);cr.style.opacity=Math.sin(t*10)>0?1:.1;
    rise(sub,t,S.subA)}};

/* ---------- FIELD: campo de fútbol con 23 personas ---------- */
B.field=(S,root)=>{chrome(S,root);
  mk(root,'abs cond',`left:60px;right:60px;top:290px;font-size:104px;line-height:.95`,S.title);
  const fx=70,fy=620,fw=860,fh=500;
  mk(root,'abs',`left:${fx}px;top:${fy}px;width:${fw}px;height:${fh}px;border:5px solid rgba(255,255,255,.3);border-radius:10px;background:rgba(40,120,70,.18)`);
  mk(root,'abs',`left:${fx+fw/2-2}px;top:${fy}px;width:5px;height:${fh}px;background:rgba(255,255,255,.3)`);
  mk(root,'abs',`left:${fx+fw/2-70}px;top:${fy+fh/2-70}px;width:140px;height:140px;border-radius:50%;border:5px solid rgba(255,255,255,.3)`);
  [0,1].forEach(s=>mk(root,'abs',`left:${s?fx+fw-150:fx}px;top:${fy+110}px;width:150px;height:${fh-220}px;border:5px solid rgba(255,255,255,.3)`));
  const fm=[[.04,.5],[.14,.15],[.14,.38],[.14,.62],[.14,.85],[.28,.28],[.28,.5],[.28,.72],[.4,.18],[.4,.5],[.4,.82]];
  const pl=[];fm.forEach(([x,y],i)=>{pl.push({x:fx+x*fw,y:fy+y*fh,c:C.y});pl.push({x:fx+(1-x)*fw,y:fy+y*fh,c:C.b})});
  const dots=pl.map(o=>mk(root,'abs',`left:${o.x-19}px;top:${o.y-19}px;width:38px;height:38px;border-radius:50%;background:${o.c};border:4px solid ${C.ink};opacity:0`));
  const ref=mk(root,'abs',`left:${fx+fw/2-23}px;top:${fy+fh/2-23}px;width:46px;height:46px;border-radius:50%;background:${C.r};border:5px solid #fff;opacity:0`);
  const n=mk(root,'abs cond',`left:60px;top:1150px;font-size:230px;color:${C.y};line-height:.8;display:none`,'');
  const lab=mk(root,'abs cond',`left:0;right:130px;top:1130px;text-align:center;font-size:60px;color:rgba(244,241,234,.8)`,'');
  return t=>{let c=0;dots.forEach((d,i)=>{const a=S.pA+i*S.pD;pop(d,t,a,.25,.2);if(t>=a)c++});pop(ref,t,S.rA,.3,.2);if(t>=S.rA)c++;
    lab.innerHTML=t>=S.pA?`<span style="color:${C.y};font-size:100px">${c}</span> personas`:'';lab.style.opacity=t>=S.pA?1:0}};

/* ---------- GAUGE ---------- */
B.gauge=(S,root)=>{chrome(S,root);
  const R=220,CIRC=2*Math.PI*R;
  const top=mk(root,'abs cond',`left:0;right:0;top:300px;text-align:center;font-size:120px;line-height:.95`,'');
  mk(root,'abs',`left:240px;top:470px;width:600px;height:600px`,`<svg viewBox="0 0 600 600" width="600" height="600" style="transform:rotate(-90deg)"><circle cx="300" cy="300" r="${R}" stroke="rgba(255,255,255,.1)" stroke-width="44" fill="none"/><circle id="gr" cx="300" cy="300" r="${R}" stroke="${C.y}" stroke-width="44" fill="none" stroke-linecap="round" stroke-dasharray="${CIRC}" stroke-dashoffset="${CIRC}"/></svg>`);
  const pc=mk(root,'abs cond',`left:240px;width:600px;top:640px;text-align:center;font-size:190px;color:${C.y}`,'0%');
  const lb=mk(root,'abs cond',`left:240px;width:600px;top:850px;text-align:center;font-size:44px;color:rgba(244,241,234,.7)`,S.label||'mismo cumpleaños');
  const gr=root.querySelector('#gr');
  const st=S.stamp&&mk(root,'stamp',`left:${S.stamp.x}px;top:${S.stamp.y}px;font-size:${S.stamp.s||110}px;border-color:${S.stamp.c||C.g};color:${S.stamp.c||C.g}`,S.stamp.t);
  return t=>{let v=0,n=S.steps[0].n,cur=S.steps[0];S.steps.forEach((s,i)=>{if(t>=s.a-.2){cur=s;n=s.n;const from=i?S.steps[i-1].pct:0;v=lerp(from,s.pct,eio(p(t,s.a,s.d||1)))}});
    gr.setAttribute('stroke-dashoffset',CIRC*(1-v/100));pc.textContent=es(v,v>=99?0:(Math.abs(v-Math.round(v))<.01?0:1))+'%';
    pc.style.color=v>=95?C.g:C.y;gr.setAttribute('stroke',v>=95?C.g:C.y);
    top.innerHTML=`<span style="color:${C.y}">${n}</span> personas`;
    if(st){slam(st,t,S.stamp.a,-5);shake(t,S.stamp.a,.25,14)}}};

/* ---------- PAIRS: todos contra todos ---------- */
B.pairs=(S,root)=>{chrome(S,root);
  const N=23,cx=540,cy=700,R=360;
  const pts=[...Array(N)].map((_,i)=>{const a=i/N*2*Math.PI-Math.PI/2;return[cx+R*Math.cos(a),cy+R*Math.sin(a)]});
  const pairs=[];for(let i=0;i<N;i++)for(let j=i+1;j<N;j++)pairs.push([i,j]);
  let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;pairs.sort(()=>rnd()-.5);
  const svg=mk(root,'abs','left:0;top:0;width:1080px;height:1400px');
  svg.innerHTML=`<svg viewBox="0 0 1080 1400" width="1080" height="1400">`+
   [...Array(N-1)].map((_,i)=>`<line class="m" x1="${pts[0][0]}" y1="${pts[0][1]}" x2="${pts[i+1][0]}" y2="${pts[i+1][1]}" stroke="${C.y}" stroke-width="5" opacity="0"/>`).join('')+
   pairs.map(([i,j])=>`<line class="a" x1="${pts[i][0]}" y1="${pts[i][1]}" x2="${pts[j][0]}" y2="${pts[j][1]}" stroke="${C.paper}" stroke-width="2" opacity="0"/>`).join('')+
   pts.map(([x,y],i)=>`<circle class="n" cx="${x}" cy="${y}" r="${i?15:26}" fill="${i?C.paper:C.y}" stroke="${C.ink}" stroke-width="4"/>`).join('')+`</svg>`;
  const mL=[...svg.querySelectorAll('.m')],aL=[...svg.querySelectorAll('.a')];
  const you=mk(root,'abs cond',`left:${pts[0][0]+36}px;top:${pts[0][1]-30}px;font-size:56px;color:${C.y}`,'TÚ');
  const big=mk(root,'abs cond',`left:0;right:0;top:560px;text-align:center;font-size:280px;color:${C.y};text-shadow:0 0 50px rgba(0,0,0,.9),0 0 20px rgba(0,0,0,.9)`,'');
  const bl=mk(root,'abs cond',`left:0;right:0;top:860px;text-align:center;font-size:76px;color:${C.paper};text-shadow:0 0 30px #000,0 0 14px #000`,'');
  return t=>{const k1=p(t,S.m1,S.m1d);mL.forEach((e,i)=>{const q=cl(k1*mL.length-i);e.setAttribute('opacity',q*(1-p(t,S.m1+S.m1d+.6,.4))*.95)});
    const k2=p(t,S.a2,S.a2d);aL.forEach((e,i)=>e.setAttribute('opacity',cl(k2*aL.length-i)*.28));
    you.style.opacity=t>S.m1-.3?1-p(t,S.a2-.2,.2):0;
    const kk=eo(p(t,S.cA,S.cD));big.textContent=t>=S.cA?Math.round(253*kk):'';bl.textContent=t>=S.cA?'PAREJAS':'';
    if(S.oppA&&t>=S.oppA){bl.textContent='OPORTUNIDADES';bl.style.transform=`scale(${1+.05*Math.sin((t-S.oppA)*12)})`;shake(t,S.oppA,.2,10)}else bl.style.transform=''}};

/* ---------- WHATSAPP ---------- */
B.whatsapp=(S,root)=>{chrome(S,root);
  const ph=mk(root,'card',`left:90px;right:170px;top:300px;height:760px;background:#0B141A;border-radius:44px;overflow:hidden`);
  mk(ph,'abs',`left:0;right:0;top:0;height:120px;background:#1F2C34;padding:26px 36px`,`<div style="font-weight:800;font-size:44px">Familia</div><div style="font-size:26px;color:#8696A0;margin-top:4px">${S.members} participantes</div>`);
  const ms=S.msgs.map((m,i)=>mk(ph,'abs',`left:${m.me?150:30}px;right:${m.me?30:150}px;top:${150+i*205}px;background:${m.me?'#005C4B':'#202C33'};border-radius:22px;padding:18px 26px;opacity:0`,
    `<div style="font-weight:800;font-size:26px;color:${m.c}">${m.who}</div><div style="font-size:38px;margin-top:4px;line-height:1.1">${m.t}</div>`));
  const q=mk(root,'abs cond',`left:0;right:130px;top:1070px;text-align:center;font-size:110px;color:${C.y}`,S.q);
  return t=>{ms.forEach((e,i)=>{const k=eo(p(t,S.msgs[i].a,.3));e.style.opacity=k;e.style.transform=`translateY(${(1-k)*40}px)`});
    slam(q,t,S.qA,-3,1.6);shake(t,S.qA,.25,12)}};

/* ---------- SETUP ---------- */
const ROOT=$('scenes');
const SC=DATA.scenes.map(S=>{const root=mk(ROOT,'scene','');return{S,root,upd:B[S.type](S,root)}});
const SUBS=DATA.subs;
window.render=t=>{
  SH={x:0,y:0};
  let cur=null;
  SC.forEach(o=>{const on=t>=o.S.start&&t<o.S.end;o.root.style.display=on?'block':'none';if(on){cur=o;o.upd(t)}});
  $('glow').style.setProperty('--g',cur&&cur.S.glow||'rgba(255,225,77,.10)');
  const st=cur?cur.S.start:0;
  const punch=1+.04*(1-eo(p(t,st,.28)));
  $('flash').style.opacity=.55*(1-p(t,st,.14))*(st>0?1:0);
  $('cam').style.transform=`scale(${punch+0.012*Math.sin(t*.9)}) translate(${SH.x}px,${SH.y}px)`;
  $('grid').style.transform=`translateY(${(t*14)%60}px)`;
  $('grain').style.transform=`translate(${Math.floor(t*30)%7*9}px,${Math.floor(t*30)%5*9}px)`;
  $('bar').style.width=(t/DATA.dur*100)+'%';
  $('ep').textContent=DATA.ep;
  let html='';
  for(const c of SUBS){if(t>=c.s-.02&&t<c.e+.08){const k=p(t,c.s-.02,.12);
    html=c.w.map(w=>{const act=t>=w.s-.03;const on=act&&t<w.e+.06;const num=/\d|%|€/.test(w.t);
      return `<span style="color:${on?(num?C.o:C.y):C.paper};opacity:${act?1:0}">${w.t}</span>`}).join('');
    $('subs').style.transform=`scale(${.88+.12*eb(k)})`;break}}
  $('subs').innerHTML=html;
};
window.ready=document.fonts.ready.then(()=>true);
</script></body></html>
