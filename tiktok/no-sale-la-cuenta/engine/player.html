<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Archivo;src:url(archivo.woff2) format('woff2');font-weight:100 900;font-stretch:62% 125%}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0B0C10}
body{font-family:Archivo,"DejaVu Sans",sans-serif;color:#F4F1EA;-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;overflow:hidden;background:#0B0C10}
#fxw{position:absolute;inset:0}
#cam{position:absolute;inset:0;transform-origin:540px 760px;transform-style:preserve-3d}
.scene{transform-style:preserve-3d}
#fx{position:absolute;inset:0;pointer-events:none}
#fx i{position:absolute;display:block;opacity:0}
#glow{position:absolute;inset:-100px;background:radial-gradient(ellipse 70% 40% at 50% 38%,var(--g,rgba(255,225,77,.10)),transparent 70%)}
.grid{position:absolute;inset:-200px;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:60px 60px}
.scene{position:absolute;inset:0;display:none}
.abs{position:absolute}
.cond{font-stretch:72%;font-weight:900;text-transform:uppercase;letter-spacing:-.01em;line-height:.92}
.tag{position:absolute;left:70px;top:230px;font-weight:800;font-size:32px;letter-spacing:.14em;text-transform:uppercase;padding:12px 22px;border-radius:8px;background:#FFE14D;color:#0B0C10}
.tag.red{background:#FF2D55;color:#fff}
.src{position:absolute;left:70px;right:150px;top:1110px;font-size:25px;color:rgba(244,241,234,.55);font-weight:500;letter-spacing:.02em}
.card{position:absolute;background:#17181E;border:2px solid rgba(255,255,255,.09);border-radius:34px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.stamp{position:absolute;border:12px solid #FF2D55;color:#FF2D55;font-stretch:72%;font-weight:900;text-transform:uppercase;padding:8px 32px;border-radius:18px;letter-spacing:.02em;background:rgba(11,12,16,.6);white-space:nowrap}
#subs{position:absolute;left:0;right:110px;top:1262px;text-align:center;font-stretch:72%;font-weight:900;font-size:100px;line-height:1.02;text-transform:uppercase;paint-order:stroke fill;-webkit-text-stroke:14px #07070a;letter-spacing:.005em;padding:0 40px}
#subs span{display:inline-block;margin:0 12px}
#hud{position:absolute;inset:0;pointer-events:none}
#top{position:absolute;left:0;right:0;top:0;height:8px;background:rgba(255,255,255,.12)}
#bar{height:100%;background:#FFE14D;width:0}
#brand{position:absolute;left:70px;top:118px;display:flex;align-items:center;gap:16px;font-weight:900;font-stretch:75%;font-size:36px;letter-spacing:.12em;color:rgba(244,241,234,.9)}
#logo{position:relative;width:54px;height:54px;border-radius:14px;background:#FFE14D}
#logo i{position:absolute;left:11px;width:32px;height:6px;border-radius:3px;background:#0B0C10}
#logo i.a{top:18px}#logo i.b{top:31px}#logo i.s{left:25px;top:9px;width:6px;height:36px;transform:rotate(24deg)}
#ep{position:absolute;right:130px;top:128px;font-weight:800;font-size:26px;letter-spacing:.18em;color:rgba(244,241,234,.5)}
#flash{position:absolute;inset:0;background:#fff;opacity:0}
#vign{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.6))}
#grain{position:absolute;inset:-60px;opacity:.07;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>")}
.car{position:absolute;width:190px;height:84px}
.car .bd{position:absolute;left:0;right:0;top:26px;height:42px;border-radius:16px 22px 10px 10px;background:var(--c)}
.car .cb{position:absolute;left:38px;top:0;width:100px;height:36px;border-radius:22px 26px 0 0;background:var(--c);filter:brightness(.88)}
.car .cb:after{content:"";position:absolute;left:12px;right:12px;top:8px;bottom:0;border-radius:14px 16px 0 0;background:#0B0C10;opacity:.75}
.car .w{position:absolute;top:52px;width:34px;height:34px;border-radius:50%;background:#0B0C10;border:6px solid #8b8d96}
.car.clear .cb:after{background:rgba(190,225,255,.16)}
.car .bl{position:absolute;left:-6px;top:36px;width:14px;height:12px;border-radius:4px;background:#FF2D55;opacity:0;box-shadow:0 0 30px 10px rgba(255,45,85,.8)}
</style></head>
<body><div id="stage"><div id="fxw"><div id="cam">
<div id="glow"></div><div class="grid" id="grid"></div>
<div id="scenes"></div>
</div></div><div id="fx"></div>
<div id="subs"></div>
<div id="vign"></div><div id="grain"></div>
<div id="hud"><div id="top"><div id="bar"></div></div>
<div id="brand"><div id="logo"><i class="a"></i><i class="b"></i><i class="s"></i></div>NO SALE LA CUENTA</div><div id="ep"></div></div>
<div id="flash"></div></div>
<script>
const DATA=/*DATA*/null;
const C={ink:'#0B0C10',paper:'#F4F1EA',y:'#FFE14D',r:'#FF2D55',g:'#7BE38B',b:'#3B82F6',o:'#FF7A4D'};
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const p=(t,a,d)=>cl((t-a)/d);
const eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eb=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const lerp=(a,b,k)=>a+(b-a)*k;
const el=x=>x<=0?0:x>=1?1:Math.pow(2,-9*x)*Math.sin((x*10-.75)*2.0944)+1;
const es=(n,d=0)=>n.toFixed(d).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,d?'':'.');
function mk(parent,cls,css,html){const e=document.createElement('div');if(cls)e.className=cls;if(css)e.style.cssText=css;if(html!=null)e.innerHTML=html;parent.appendChild(e);return e}
let SH={x:0,y:0};
const shake=(t,a,d=.25,amp=14)=>{if(t>a&&t<a+d){const k=1-(t-a)/d;SH.x+=Math.sin(t*130)*amp*k;SH.y+=Math.cos(t*95)*amp*.7*k}};
const pop=(e,t,a,d=.3,s0=.5)=>{const k=p(t,a,d*1.6);e.style.opacity=k>0?1:0;e.style.transform=`scale(${lerp(s0,1,el(k))})`};
const rise=(e,t,a,d=.4,dy=60)=>{const k=eo(p(t,a,d));e.style.opacity=k;e.style.transform=`translateY(${(1-k)*dy}px)`};
const slam=(e,t,a,rot=0,s0=2.2)=>{const k=p(t,a,.5);const sq=k<.3?1+.12*Math.sin(k/.3*Math.PI):1;e.style.opacity=k>0?1:0;e.style.transform=`scale(${lerp(s0,1,el(k))*sq},${lerp(s0,1,el(k))/sq}) rotate(${rot*(1+(1-el(k)))}deg)`};
function chrome(S,root){if(S.tag)mk(root,'tag'+(S.red?' red':''),'',S.tag);if(S.src)mk(root,'src','',S.src)}
function stick(parent,css,color=C.paper,w=9){
  const d=mk(parent,'abs',css+';width:130px;height:270px;transform-origin:65px 160px');
  const E=(x)=>`<circle cx="${x}" cy="38" r="4.5"/>`;
  d.innerHTML=`<svg viewBox="0 0 130 270" width="130" height="270" style="overflow:visible"><g stroke="${color}" stroke-width="${w}" stroke-linecap="round" fill="none">
  <line class="t" x1="65" y1="76" x2="65" y2="160"/><line class="al" x1="65" y1="100"/><line class="ar" x1="65" y1="100"/><line class="ll" x1="65" y1="160"/><line class="lr" x1="65" y1="160"/>
  <circle cx="65" cy="42" r="32" fill="${C.ink}"/>
  <g class="f n" fill="${color}" stroke="none">${E(53)}${E(77)}</g><path class="f n" d="M54 56 Q65 61 76 56" stroke-width="5"/>
  <g class="f smile" style="display:none"><g fill="${color}" stroke="none">${E(53)}${E(77)}</g><path d="M46 52 Q65 76 84 52" stroke-width="5" fill="${color}"/></g>
  <g class="f shock" style="display:none" fill="${color}" stroke="none"><circle cx="53" cy="36" r="8" fill="#fff"/><circle cx="77" cy="36" r="8" fill="#fff"/><circle cx="53" cy="36" r="3" fill="${C.ink}"/><circle cx="77" cy="36" r="3" fill="${C.ink}"/><ellipse cx="65" cy="58" rx="7" ry="9" fill="${C.ink}" stroke="${color}" stroke-width="4"/></g>
  <g class="f dead" style="display:none" stroke-width="5"><path d="M46 30 L60 44 M60 30 L46 44 M70 30 L84 44 M84 30 L70 44"/><path d="M52 60 Q65 52 78 60"/></g>
  <g class="f angry" style="display:none"><g fill="${color}" stroke="none">${E(53)}${E(77)}</g><path d="M42 24 L60 33 M88 24 L70 33" stroke-width="6"/><path d="M52 60 Q65 52 78 60" stroke-width="5"/></g>
  <g class="f sweat" style="display:none"><g fill="${color}" stroke="none"><circle cx="53" cy="38" r="5"/><circle cx="77" cy="38" r="5"/></g><path d="M54 58 Q60 54 65 58 Q70 62 76 58" stroke-width="5"/><path d="M100 18 Q108 34 100 40 Q92 34 100 18Z" fill="#7BD0FF" stroke="none"/></g>
  </g></svg>`;
  const q=s=>d.querySelector(s),L=(e,x,y,a,l)=>{e.setAttribute('x2',x+l*Math.sin(a*Math.PI/180));e.setAttribute('y2',y+l*Math.cos(a*Math.PI/180))};
  const al=q('.al'),ar=q('.ar'),ll=q('.ll'),lr=q('.lr'),fs=[...d.querySelectorAll('.f')];let last='';
  return {el:d,pose(o){L(al,65,100,o.aL??25,54);L(ar,65,100,o.aR??-25,54);L(ll,65,160,o.lL??12,86);L(lr,65,160,o.lR??-12,86);
    const face=o.face||(o.shock?'shock':'n');if(face!==last){fs.forEach(e=>e.style.display=e.classList.contains(face)?'':'none');last=face}
    d.style.transform=`translate(${o.x||0}px,${o.y||0}px) rotate(${o.rot||0}deg) scale(${o.sc||1})`;d.style.opacity=o.op??1}};
}
const B={};

/* ---------- TITLE: líneas cinéticas ---------- */
B.title=(S,root)=>{chrome(S,root);
  const box=mk(root,'abs',`left:50px;right:50px;top:${S.top||330}px;display:flex;flex-direction:column;align-items:${S.align||'center'};gap:${S.gap||10}px;text-align:${S.align==='flex-start'?'left':'center'}`);
  const ls=S.lines.map(l=>({l,e:mk(box,'cond',`font-size:${l.s||130}px;color:${l.c||C.paper};opacity:0;${l.css||''}`,l.t)}));
  const st=S.stamp&&mk(root,'stamp',`left:${S.stamp.x??140}px;top:${S.stamp.y??900}px;font-size:${S.stamp.s||130}px;border-color:${S.stamp.c||C.r};color:${S.stamp.c||C.r}`,S.stamp.t);
  return t=>{ls.forEach(({l,e})=>{if(l.k==='rise')rise(e,t,l.a);else if(l.k==='pop')pop(e,t,l.a);else{slam(e,t,l.a,0,1.5);}
      if(l.out&&t>l.out){e.style.opacity=1-p(t,l.out,.2)}
      if(l.k!=='rise'&&l.k!=='pop'&&t>l.a&&t<l.a+.2)shake(t,l.a,.2,6)});
    if(st){slam(st,t,S.stamp.a,S.stamp.r??-6);shake(t,S.stamp.a,.25,16)}}};

/* ---------- RACE ---------- */
B.race=(S,root)=>{chrome(S,root);
  mk(root,'abs cond',`left:0;right:0;top:290px;text-align:center;font-size:210px;line-height:.95`,`<span style="color:${C.y}">${S.lanes[1].v}</span> <span style="font-size:84px;color:rgba(244,241,234,.55)">vs</span> ${S.lanes[0].v}`);
  mk(root,'abs cond',`left:0;right:0;top:520px;text-align:center;font-size:62px;color:rgba(244,241,234,.8)`,`km/h · viaje de <span style="color:${C.y}">${S.dist} km</span>`);
  const L=S.lanes.map((ln,i)=>{const y=640+i*235;
    mk(root,'abs',`left:40px;right:110px;top:${y-10}px;height:185px;border-radius:16px;background:#14151a;border:2px solid rgba(255,255,255,.07)`);
    const dash=mk(root,'abs',`left:40px;right:110px;top:${y+150}px;height:6px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.3) 0 36px,transparent 36px 72px)`);
    mk(root,'abs',`left:920px;top:${y-10}px;width:30px;height:185px;background:repeating-conic-gradient(#fff 0 25%,#111 0 50%) 0 0/30px 30px`);
    const car=mk(root,'car',`--c:${ln.color};left:70px;top:${y}px;transform-origin:0 0`,`<div class="bl"></div><div class="bd"></div><div class="cb"></div><div class="w" style="left:26px"></div><div class="w" style="left:128px"></div><div class="cond" style="position:absolute;left:62px;top:25px;width:70px;text-align:center;font-size:30px;color:${C.ink};z-index:3">${ln.v}</div>`);
    const clk=mk(root,'abs cond',`right:130px;top:${y-6}px;font-size:70px;color:${ln.color};text-shadow:0 0 14px #000`,'0:00');
    return {ln,car,clk,dash}});
  const gap=mk(root,'abs cond',`left:0;right:0;top:1040px;text-align:center;font-size:210px;color:${C.y};text-shadow:0 0 60px rgba(255,225,77,.45)`,S.gapText);
  return t=>{const t0=S.t0;
    L.forEach((o,i)=>{const T=S.dur[i];const k=cl((t-t0)/T);const x=70+(920-70-290)*k;
      o.car.style.left=x+'px';o.car.style.transform=`scale(1.5) translateY(${Math.sin(t*40)*(k>0&&k<1?1.5:0)}px)`;o.dash.style.backgroundPosition=-(t*900%72)+'px 0';
      const mins=S.dist/o.ln.v*60*k;o.clk.textContent=Math.floor(mins)+':'+String(Math.floor((mins%1)*60)).padStart(2,'0');
      o.clk.style.opacity=t>t0?1:0});
    slam(gap,t,S.gapAt,0,1.8);if(t>S.gapAt)shake(t,S.gapAt,.3,16);
    if(t<S.gapAt)gap.style.opacity=0}};

/* ---------- NETFLIX ---------- */
B.netflix=(S,root)=>{chrome(S,root);
  mk(root,'abs cond',`left:0;right:0;top:300px;text-align:center;font-size:118px`,'¿Qué <span style="color:#E50914">veo</span>?');
  const cols=['#3a1c71','#d76d77','#0f2027','#1e3c72','#614385','#134e5e','#4b1248','#232526','#1f4037'];
  const tiles=cols.map((c,i)=>mk(root,'abs',`left:${130+(i%3)*270}px;top:${500+Math.floor(i/3)*215}px;width:250px;height:195px;border-radius:14px;background:linear-gradient(135deg,${c},#111);border:4px solid transparent`));
  const tm=mk(root,'abs cond',`left:0;right:0;top:1160px;text-align:center;font-size:90px;color:${C.y}`,'3:00');
  return t=>{const k=cl((t-S.a)/S.d);const idx=Math.floor((t-S.a)/.21)%9;
    tiles.forEach((e,i)=>{const on=i===(idx*4+(idx>5?1:0))%9&&t>S.a;e.style.borderColor=on?'#fff':'transparent';e.style.transform=on?'scale(1.06)':'scale(1)'});
    const s=180*(1-k);tm.textContent=Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
    tm.style.color=k>=1?C.r:C.y;if(k>=1)tm.textContent='0:00 · SIGUES ELIGIENDO'.slice(0,4)}};

/* ---------- BRAKE: simulación real de frenada ---------- */
B.brake=(S,root)=>{chrome(S,root);
  const v0=S.v/3.6,A=7,RT=1,D=S.D,PX=5.6,CX=60;
  {const xr=v0*RT,disc=v0*v0-2*A*(D-xr),uh=disc>0?(v0-Math.sqrt(disc))/A:Infinity;S.hit=uh<v0/A;S.tHit=S.hit?S.tA+(RT+uh)/S.warp:0}
  mk(root,'abs cond',`left:70px;top:300px;font-size:190px;color:${S.color};line-height:.9`,`${S.v}<span style="font-size:70px"> km/h</span>`);
  const sp=mk(root,'abs cond',`right:150px;top:420px;font-size:150px;text-align:right;opacity:.75;color:${C.paper}`,'');
  mk(root,'abs',`left:0;right:0;top:700px;height:280px;background:#14151a;border-top:3px solid #2a2b33;border-bottom:3px solid #2a2b33`);
  const dash=mk(root,'abs',`left:0;right:0;top:888px;height:9px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.4) 0 60px,transparent 60px 130px)`);
  const car=mk(root,'car',`--c:${S.color};left:${CX}px;top:760px;transform:scale(2);transform-origin:0 0`,'<div class="bl"></div><div class="bd"></div><div class="cb"></div><div class="w" style="left:26px"></div><div class="w" style="left:128px"></div>');
  const ob=stick(root,'left:0;top:690px',C.y,9);
  const dist=mk(root,'abs cond',`left:0;right:0;top:1030px;text-align:center;font-size:96px;color:${C.paper}`,'');
  const res=mk(root,'abs cond',`left:0;right:0;top:1000px;text-align:center;font-size:220px;color:${S.hit?C.r:C.g};text-shadow:0 10px 50px rgba(0,0,0,.7);line-height:.8`,'');
  const sub=mk(root,'abs cond',`left:0;right:0;top:560px;text-align:center;font-size:110px;color:${S.hit?C.r:C.g}`,'');
  const bl=car.querySelector('.bl');
  function sim(s){let x,spd,hit=false,tu=0;
    if(s<=RT){x=v0*s;spd=v0}else{const u=s-RT;const xr=v0*RT;
      const disc=v0*v0-2*A*(D-xr);const uh=disc>0?(v0-Math.sqrt(disc))/A:Infinity;const us=v0/A;
      if(uh<us){if(u>=uh){x=D;spd=v0-A*uh;hit=true}else{x=xr+v0*u-.5*A*u*u;spd=v0-A*u}}
      else{const uu=Math.min(u,us);x=xr+v0*uu-.5*A*uu*uu;spd=Math.max(0,v0-A*uu)}}
    return{x,spd,hit,brake:s>RT}}
  return t=>{const s=Math.max(0,(t-S.tA)*S.warp);const m=sim(s);const carX=CX+(S.v>0?0:0);
    const obx=CX+400+(D-m.x)*PX;
    const act=t>=S.tA-.35;const k=eo(p(t,S.tA-.35,.3));
    const walking=t<S.tA,wk=p(t,S.tA-.8,.8),sw=Math.sin(t*14);
    let o={x:walking?lerp(1160,obx,eo(wk)):obx,y:0,sc:1.15,face:walking?'n':'shock',op:t>=S.tA-.8?1:0,aL:walking?sw*35:-70,aR:walking?-sw*35:70,lL:walking?sw*30:10,lR:walking?-sw*30:-10};
    if(m.hit){const q=(t-S.tHit)/1;if(q>0){o.x=obx+q*520;o.y=-Math.sin(Math.min(q,1)*Math.PI)*260+q*60;o.rot=q*700;o.aL=-150;o.aR=150}}
    ob.pose(o);
    car.style.left=CX+'px';dash.style.backgroundPosition=-((m.x*PX)%130)+'px 0';
    bl.style.opacity=m.brake?1:0;
    const kmh=Math.round(m.spd*3.6);sp.innerHTML=act?`${kmh}<span style="font-size:50px">km/h</span>`:'';
    const left=Math.max(0,D-m.x);dist.innerHTML=act?`a <span style="color:${C.y}">${Math.round(left)} m</span> del obstáculo`:'';
    if(m.hit){if(t>S.tHit&&t<S.tHit+.6){shake(t,S.tHit,.5,26)} const q=p(t,S.tHit,.25);car.style.transform=`scale(2) translateX(${-q*14}px)`;
      res.textContent=kmh+' km/h';res.style.opacity=q;res.style.transform=`scale(${lerp(1.6,1,eo(q))})`;sub.textContent='IMPACTO';sub.style.opacity=q;
      dist.style.opacity=0}
    else if(m.spd===0&&s>RT){const q=p(t,t,1);res.textContent='0 m';res.style.opacity=1;sub.textContent='PARA JUSTO';sub.style.opacity=1;dist.style.opacity=0;
      if(!S.tStop)S.tStop=t}
    else{res.style.opacity=0;sub.style.opacity=0;dist.style.opacity=1}
    if(S.noHitFlag)S.noHitFlag=0}};

/* ---------- TOWER: caída de 7 pisos ---------- */
B.tower=(S,root)=>{chrome(S,root);
  const fl=7,fh=96,gy=1060,bx=130,bw=360;
  for(let i=0;i<fl;i++){mk(root,'abs',`left:${bx}px;width:${bw}px;top:${gy-(i+1)*fh}px;height:${fh}px;background:#16171d;border:3px solid #2c2d36`,'');
    mk(root,'abs cond',`left:${bx+14}px;top:${gy-(i+1)*fh+26}px;font-size:46px;color:rgba(244,241,234,.35)`,i+1);
    for(let w=0;w<2;w++)mk(root,'abs',`left:${bx+100+w*120}px;top:${gy-(i+1)*fh+22}px;width:70px;height:52px;border-radius:8px;background:${(i*3+w)%4==0?'rgba(255,225,77,.55)':'rgba(255,255,255,.07)'}`)}
  mk(root,'abs',`left:0;right:0;top:${gy}px;height:12px;background:${C.paper}`);
  const man=stick(root,`left:${bx+115}px;top:${gy-fl*fh-250}px`,C.paper,9);
  const cnt=mk(root,'abs cond',`left:560px;top:420px;font-size:480px;color:${C.y};line-height:.8`,'7');
  mk(root,'abs cond',`left:560px;top:830px;font-size:78px;color:rgba(244,241,234,.8)`,'pisos');
