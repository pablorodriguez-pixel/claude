<script>
/* ======================= base ======================= */
const STAGE = document.getElementById('stage');
const defsSvg = document.createElementNS(NS, 'svg');
defsSvg.setAttribute('width', '0'); defsSvg.setAttribute('height', '0'); defsSvg.style.position = 'absolute';
defsSvg.innerHTML = `<defs>${globalDefs()}
<symbol id="emuS" viewBox="0 0 400 600" overflow="visible">${emuInner({ seed: 21, fe: 110 })}</symbol>

<symbol id="emuK" viewBox="0 0 400 600" overflow="visible">${emuInner({ seed: 23, fe: 90, neck: -88 })}</symbol>
<symbol id="emuG" viewBox="0 0 400 600" overflow="visible">${emuInner({ seed: 24, fe: 110, neck: 10 })}</symbol>
<symbol id="merS" viewBox="0 0 360 460" overflow="visible">${bustInner({ hat: 'cap', uniform: 'officer', moustache: true, binos: true, seed: 3 })}</symbol>
<symbol id="solS" viewBox="0 0 360 460" overflow="visible">${bustInner({ hat: 'slouch', uniform: 'soldier', seed: 8 })}</symbol>
<symbol id="farS" viewBox="0 0 360 460" overflow="visible">${bustInner({ hat: 'brodie', uniform: 'farmer', beard: true, seed: 6 })}</symbol>
<symbol id="gunS" viewBox="0 0 460 210" overflow="visible">${gunInner()}</symbol>
<symbol id="wheat" viewBox="0 0 60 260" overflow="visible">${wheatSym()}</symbol>
<symbol id="bush" viewBox="0 0 260 170" overflow="visible">${bushSym()}</symbol>
</defs>`;
STAGE.appendChild(defsSvg);
const bg = el('div', null, { left: 0, top: 0, width: '1080px', height: '1920px', zIndex: 0 }, paperBG());
const world = el('div', null, { left: 0, top: 0, width: '1080px', height: '1920px', zIndex: 1 });

/* ---------- helpers ---------- */
const normW = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9ñ]/g, '');
const px = v => v + 'px';
function box(parent, x, y, w, h, css = {}, html) { return el('div', parent, Object.assign({ left: px(x), top: px(y), width: px(w), height: px(h) }, css), html); }
function svgW(inner, vb) { return `<svg viewBox="${vb}" width="100%" height="100%" style="overflow:visible;display:block">${inner}</svg>`; }
function mk(parent, b, inner, vb, kind) {
  const d = box(parent, b[0], b[1], b[2], b[3]); d.innerHTML = svgW(inner, vb); const q = s => d.querySelector(s);
  return { d, kind, jaw: q('.jaw'), pup: [...d.querySelectorAll('.pup')], lidH: q('.lidH'), lidC: q('.lidC'), wing: q('.wing'), neck: q('.neckg'), legL: q('.legL'), legR: q('.legR'), flash: q('.flash'), brow: q('.brow'), wheels: [...d.querySelectorAll('.wheel,.twheel')], track: q('.track') };
}
const mkEmu = (pa, b, o = {}) => mk(pa, b, emuInner(o), '0 0 400 600', 'emu');
const mkBust = (pa, b, o = {}) => mk(pa, b, bustInner(o), '0 0 360 460', 'bust');
const mkMer = (pa, b) => mkBust(pa, b, { hat: 'cap', uniform: 'officer', moustache: true, binos: true, seed: 3 });
const mkSol = (pa, b, seed = 8) => mkBust(pa, b, { hat: 'slouch', uniform: 'soldier', seed });
const mkFar = (pa, b) => mkBust(pa, b, { hat: 'brodie', uniform: 'farmer', beard: true, seed: 6 });
const mkGun = (pa, b) => mk(pa, b, gunInner(), '0 0 460 210', 'gun');
function face(f, t, o = {}) {
  const j = o.jaw || 0;
  if (f.jaw) f.jaw.setAttribute('transform', f.kind === 'emu' ? `rotate(${f1(-j * 34)} 103 103)` : `translate(0 ${f1(j * 32)})`);
  const lk = o.look || [0, 0]; f.pup.forEach(q => q.setAttribute('transform', `translate(${f1(lk[0])} ${f1(lk[1])})`));
  const bl = o.blink !== false && (((t + (o.seed || 0)) % 3.3) < 0.13);
  if (f.lidC) f.lidC.style.opacity = (bl || o.closed) ? 1 : 0;
  if (f.lidH) f.lidH.style.opacity = (!bl && !o.closed && o.half) ? 1 : 0;
  if (f.wing) f.wing.setAttribute('transform', `rotate(${f1(o.wing || 0)} 270 304)`);
  if (f.neck) f.neck.setAttribute('transform', `rotate(${f1(o.neck || 0)} 172 286)`);
  if (f.legL) { f.legL.setAttribute('transform', `rotate(${f1(o.legL || 0)} 200 392)`); f.legR.setAttribute('transform', `rotate(${f1(o.legR || 0)} 262 384)`); }
  if (f.brow) f.brow.setAttribute('transform', `translate(0 ${f1(o.brow || 0)})`);
}
function run(f, t, sp = 16, amp = 32) { const k = Math.sin(t * sp); return { legL: k * amp, legR: -k * amp }; }
function talk(t, i0, i1, amp = 0.75) { for (let i = i0; i <= i1; i++) { const x = W[i]; if (t >= x.s && t <= x.e) { const n = Math.max(1, Math.round((x.e - x.s) / 0.17)); return Math.abs(Math.sin((t - x.s) / (x.e - x.s) * Math.PI * n)) * amp; } } return 0; }
function svgLayer(parent, z = 1) { const d = el('div', parent, { left: 0, top: 0, width: '1080px', height: '1920px', zIndex: z }); d.innerHTML = `<svg width="1080" height="1920" viewBox="0 0 1080 1920" style="overflow:visible;position:absolute;left:0;top:0"></svg>`; return d.firstChild; }
function use(svg, href, w, h) { const u = document.createElementNS(NS, 'use'); u.setAttribute('href', href); u.setAttribute('width', w); u.setAttribute('height', h); svg.appendChild(u); return u; }
function placeU(u, x, y, w, o = {}) { let tr = `translate(${f1(x)},${f1(y)})`; if (o.r) tr += ` rotate(${f1(o.r)} ${f1(w / 2)} ${f1(w * 0.75)})`; if (o.flip) tr += ` translate(${f1(w)},0) scale(-1,1)`; if (o.s != null && o.s !== 1) tr += ` translate(${f1(w / 2)},${f1(w * 1.5)}) scale(${f1(o.s * 100) / 100}) translate(${f1(-w / 2)},${f1(-w * 1.5)})`; u.setAttribute('transform', tr); u.style.opacity = o.o == null ? 1 : o.o; }
function jag(seed, amt = 1.2, n = 10) { const r = rng(seed); const pts = []; for (let i = 0; i <= n; i++) pts.push([i / n * 100, r() * amt]); for (let i = 1; i <= n; i++) pts.push([100 - r() * amt, i / n * 100]); for (let i = n - 1; i >= 0; i--) pts.push([i / n * 100, 100 - r() * amt]); for (let i = n - 1; i >= 1; i--) pts.push([r() * amt, i / n * 100]); return 'polygon(' + pts.map(q => q[0].toFixed(2) + '% ' + q[1].toFixed(2) + '%').join(',') + ')'; }
function paperPiece(parent, x, y, w, h, o = {}) {
  const wrap = box(parent, x, y, w, h, { filter: `drop-shadow(9px 11px 0 ${SH})` });
  box(wrap, 0, 0, w, h, { background: '#fff', clipPath: jag(o.seed || 3, 1.4, 12) });
  const inner = box(wrap, 9, 9, w - 18, h - 18, { background: o.bg || '#F7F0E0', clipPath: jag((o.seed || 3) + 50, 0.8, 12), overflow: 'hidden' });
  if (!o.plain) box(inner, 0, 0, w - 18, h - 18, { background: 'radial-gradient(circle at 70% 30%, rgba(160,110,40,.0) 40%, rgba(160,110,40,.18) 100%)' });
  return { wrap, inner };
}
function chip(parent, x, y, html, o = {}) { return el('div', parent, { left: px(x), top: px(y), background: o.bg || PINK, color: o.color || '#fff', fontFamily: 'Bricolage', fontWeight: 800, fontSize: px(o.size || 36), padding: '8px 26px 10px', borderRadius: '100px', border: `4px solid ${INK}`, boxShadow: `6px 6px 0 ${INK}`, whiteSpace: 'nowrap', lineHeight: 1.1 }, html); }
function stamp(parent, x, y, html, o = {}) { return el('div', parent, { left: px(x), top: px(y), border: `${o.bw || 9}px solid ${o.col || RED}`, color: o.col || RED, fontFamily: o.font || 'Rye', fontSize: px(o.size || 64), padding: '4px 26px 8px', borderRadius: '14px', whiteSpace: 'nowrap', mixBlendMode: 'multiply', lineHeight: 1.05, letterSpacing: '0.04em', background: 'rgba(200,16,46,.04)' }, html); }
function stampA(e, t, t0, r = -10, base = 1) { const k = p(t, t0, 0.18, E.outCubic); set(e, { s: t < t0 ? 0 : lerp(2.3, 1, k) * base, r, o: t < t0 ? 0 : clamp(k * 2) * 0.93 }); }
function popA(e, t, t0, o = {}) { const k = pop(t, t0, o.d || 0.42); set(e, { x: o.x || 0, y: (o.y || 0) + (o.rise ? (1 - clamp(k)) * o.rise : 0), s: k * (o.s || 1), r: o.r || 0, o: t < t0 ? 0 : (o.o == null ? 1 : o.o) }); }
const XSVG = `<svg viewBox="0 0 100 100" width="100%" height="100%" style="overflow:visible"><path d="M14,16 Q50,50 88,86 M86,12 Q50,50 14,88" stroke="${RED}" stroke-width="14" stroke-linecap="round" fill="none"/></svg>`;
const CHECK = `<svg viewBox="0 0 100 100" width="100%" height="100%" style="overflow:visible"><path d="M12,54 L40,82 L92,14" stroke="${INK}" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>`;
function hlSpan(txt, cls = 'hlb', col = YEL) { return `<span style="position:relative;display:inline-block;z-index:0"><span class="${cls}" style="position:absolute;left:-8px;right:-8px;bottom:4%;height:44%;background:${col};z-index:-1;transform-origin:left center;transform:scaleX(0);border-radius:4px 12px 6px 14px"></span>${txt}</span>`; }
function paint(e, t, t0, d = 0.35) { if (e) e.style.transform = `scaleX(${f1(p(t, t0, d, E.outCubic) * 1000) / 1000}) rotate(-1.2deg)`; }
function arrowSvg(d, col = PINK, w = 9) { return `<svg width="100%" height="100%" style="overflow:visible"><path d="${d}" stroke="${INK}" stroke-width="${w + 7}" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" stroke="${col}" stroke-width="${w}" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`; }
function cropUse(sym, vb, w = 400, h = 600) { return `<svg viewBox="${vb}" width="100%" height="100%" style="overflow:hidden"><use href="#${sym}" width="${w}" height="${h}"/></svg>`; }
const EMUHEAD = vb => cropUse('emuS', vb || '40 20 170 150');
const SHAKES = []; const shakeAt = (t0, d = 0.35, a = 14) => SHAKES.push([t0, d, a]);

/* ---------- titulares ---------- */
const HLS = [];
function headline(t0, t1, str, o = {}) {
  const b = el('div', world, { left: '50px', top: px(o.y || 246), width: '980px', textAlign: 'center', fontFamily: 'Playfair', fontWeight: 800, fontSize: px(o.size || 78), lineHeight: 1.08, color: INK, zIndex: 500, letterSpacing: '-0.005em' });
  const toks = []; const re = /\*([^*]+)\*|(\S+)/g; let m;
  while ((m = re.exec(str))) toks.push(m[1] ? { txt: m[1], key: true } : { txt: m[2], key: false });
  let cur = 0; while (cur < W.length && W[cur].e < t0 - 0.05) cur++;
  let prevT = t0 + 0.02; const spans = [], hls = [];
  toks.forEach(tk => {
    let tt = null;
    for (const wd of tk.txt.split(' ')) { const nw = normW(wd); if (!nw) continue; for (let j = cur; j < Math.min(W.length, cur + 12); j++) if (normW(W[j].w) === nw) { if (tt == null) tt = W[j].s; cur = j + 1; break; } }
    if (tt == null || tt > t1) tt = prevT + 0.07; tt = Math.max(tt, prevT); prevT = tt;
    const sp = document.createElement('span'); sp.style.display = 'inline-block'; sp.style.margin = '0 0.11em'; sp.style.position = 'relative';
    if (tk.key) { sp.style.fontStyle = 'italic'; sp.style.zIndex = 0; sp.innerHTML = `<span style="position:absolute;left:-10px;right:-10px;bottom:6%;height:42%;background:${o.hlc || YEL};z-index:-1;transform-origin:left center;border-radius:4px 12px 6px 14px"></span>${tk.txt}`; hls.push({ e: sp.firstChild, t: o.hlT != null ? o.hlT : tt }); }
    else sp.textContent = tk.txt;
    b.appendChild(sp); spans.push({ e: sp, t: tt });
  });
  HLS.push({ b, t0, t1, spans, hls });
}

/* ---------- escenas ---------- */
const SC = [];
function scene(t0, t1, fn, o = {}) { const c = el('div', world, { left: 0, top: 0, width: '1080px', height: '1920px', zIndex: o.z || 10 }); SC.push({ c, t0, t1, fn, dir: o.dir || 1 }); return c; }

/* ================= HUD: marcador de actos ================= */
const actBox = el('div', world, { left: '60px', top: '178px', zIndex: 600, display: 'flex', gap: '10px', alignItems: 'center' });
actBox.innerHTML = `<div style="font-family:Rye;font-size:26px;color:${PAPER};background:${INK};padding:5px 16px 7px;border-radius:10px">ACTOS</div>` + ['I', 'II', 'III'].map(n => `<div class="an" style="font-family:Playfair;font-weight:900;font-size:28px;width:58px;height:44px;line-height:42px;text-align:center;border:3px solid ${INK};border-radius:10px;background:${FIG};color:${INK}">${n}</div>`).join('');
const actNs = [...actBox.querySelectorAll('.an')]; const ACT_T = [6.72, 23.3, 62.0];
/* ================= HUD: intentos ================= */
const tick = el('div', world, { left: '60px', top: '448px', zIndex: 450, background: INK, color: YEL, fontFamily: 'Rye', fontSize: '50px', padding: '8px 28px 12px', borderRadius: '12px', whiteSpace: 'nowrap', boxShadow: `6px 6px 0 ${PINK}` }, 'INTENTO 1');
const trk = el('div', world, { left: '612px', top: '440px', zIndex: 450, display: 'flex', gap: '14px' });
trk.innerHTML = [1, 2, 3].map(n => `<div style="position:relative;width:92px;height:92px;border:5px solid ${INK};border-radius:14px;background:${FIG};font-family:Playfair;font-weight:900;font-size:58px;line-height:80px;text-align:center;color:${INK}">${n}<div class="tx" style="position:absolute;left:-10px;top:-10px;width:112px;height:112px">${XSVG}</div></div>`).join('');
const trkB = [...trk.children], trkX = [...trk.querySelectorAll('.tx')]; const TRY_T = [28.15, 32.2, 37.05], FAIL_T = [31.3, 36.55, 43.45];
/* ================= HUD: pergamino línea de tiempo ================= */
const scroll = box(world, 100, 1214, 880, 96, { zIndex: 400 });
{
  let yrs = ''; for (let i = 0; i < 9; i++) { const x = 40 + (i + 0.5) * 800 / 9, y = 1928 + i; yrs += `<text x="${f1(x)}" y="60" text-anchor="middle" font-family="Rye" font-size="${y === 1932 ? 30 : 24}" fill="${INK}">${y}</text><path d="M${f1(x)},16 v12 M${f1(x + 44)},16 v7" stroke="${INK}" stroke-width="2"/>`; }
  const x32 = 40 + 4.5 * 800 / 9;
  const roll = `<rect x="-17" y="2" width="34" height="92" rx="14" fill="${FIG}" stroke="${INK}" stroke-width="3"/><rect x="-17" y="2" width="34" height="92" rx="14" fill="url(#hF)"/><rect x="-10" y="-6" width="20" height="10" rx="4" fill="${INK}"/><rect x="-10" y="92" width="20" height="10" rx="4" fill="${INK}"/>`;
  scroll.innerHTML = `<svg viewBox="0 0 880 96" width="880" height="96" style="overflow:visible"><clipPath id="scrC"><rect class="scrR" x="30" y="0" width="0" height="96"/></clipPath>
  <g clip-path="url(#scrC)"><rect x="30" y="12" width="820" height="72" fill="#F3E7C9" stroke="${INK}" stroke-width="3"/><rect x="30" y="12" width="820" height="72" fill="url(#hP)" opacity=".5"/>
  <rect class="scrHL" x="${f1(x32 - 52)}" y="40" width="104" height="26" fill="${YEL}" style="mix-blend-mode:multiply"/>${yrs}</g>
  <g transform="translate(30,0)">${roll}</g><g class="scrRoll">${roll}</g>
  <g class="scrPin" transform="translate(${f1(x32)},0)"><path d="M0,10 L-16,-22 L16,-22 Z" fill="${PINK}" stroke="${INK}" stroke-width="3"/><circle cx="0" cy="-30" r="12" fill="${PINK}" stroke="${INK}" stroke-width="3"/></g></svg>`;
}
const scrR = scroll.querySelector('.scrR'), scrRoll = scroll.querySelector('.scrRoll'), scrPin = scroll.querySelector('.scrPin'), scrHL = scroll.querySelector('.scrHL');

/* ======================================================================
   1. GANCHO  (0 – 3.72)
   ====================================================================== */
headline(-1, 1.72, 'Australia le declaró la *guerra* a los emús', { size: 74 });
headline(1.72, 2.88, 'Y *perdió*.', { size: 96 });
headline(2.88, 3.74, 'No es una *metáfora*.', { size: 90 });
{
  const c = scene(-1, 3.72, t => {
    const sm = t > 2.2 ? 1 : 0;
    face(emu, t, { jaw: t < 2.24 ? talk(t, 0, 0, 0) + (t > 0.68 && t < 1.6 ? 0.15 : 0) : 0.75 * p(t, 2.24, 0.2, E.outBack) + Math.sin(t * 22) * 0.06 * sm, half: t > 2.24, look: t < 0.68 ? [0, 0] : t < 1.76 ? [-3, 2] : [-5, 4], seed: 1 });
    set(emu.d, { y: wobble(t, 0.6, 5), r: wobble(t, 0.4, 1.2) + (t > 2.24 ? Math.sin((t - 2.24) * 14) * 2 * (1 - p(t, 2.24, 0.8)) : 0), s: 1 + 0.03 * p(t, 0, 3.7, E.linear) });
    // flecha "el enemigo"
    popA(arw, t, -1); set(arwT, { r: -6 + wobble(t, 1.4, 2), o: 1, s: 1 + Math.max(0, Math.sin(t * 8)) * 0.04 });
    // periódico cae

   <div style="position:absolute;left:0;top:64px;width:482px;text-align:center;font-family:Playfair;font-weight:900;font-size:100px;color:${INK};letter-spacing:-0.02em">¡GUERRA!</div>

}

/* ======================================================================
   2. AGENDA  (3.72 – 6.68)
   ====================================================================== */
headline(3.72, 6.7, 'Esto va en tres *actos*', { size: 80 });
{
  const cards = [];
  const c = scene(3.72, 6.68, t => {
    cards.forEach((cd, i) => {

    });

  const data = [['ACTO I', '¿Por qué?', 4.85, 'wheat'], ['ACTO II', '¿Cómo?', 5.52, 'gun'], ['ACTO III', '¿Quién ganó?', 6.16, 'emu']];
  data.forEach((d, i) => {
    const y = 440 + i * 262;
    const wrap = box(c, 90, y, 820, 236, { background: '#17110c', borderRadius: '18px', boxShadow: `9px 11px 0 ${SH}`, border: '7px solid #fff' });
