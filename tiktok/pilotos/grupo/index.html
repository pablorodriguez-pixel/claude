// ================= PALETA CLAY (universo v1) =================

 brain:['#FFCADD','#FF8FB8','#D2527F'],brainD:['#FF9DC2','#E8679A','#B13A68'],orange:['#FFDDB4','#F2983E','#C2650F'],orangeD:['#F7B467','#DB7E22','#A4520A'],

 violet:['#BBA2DE','#8A68B8','#5A3E8A'],blue:['#D4F1FC','#8FD3F4','#55A8D2'],brown:['#E8B98A','#B9814F','#7A4C2E'],green:['#C3EAA2','#7DBE5A','#4F8A33'],
 red:['#F27985','#D8405A','#9E2238']};
let defs='';
for(const k in C){const c=C[k];defs+=`<radialGradient id="g_${k}" cx="38%" cy="30%" r="78%" fx="34%" fy="24%"><stop offset="0" stop-color="${c[0]}"/><stop offset=".55" stop-color="${c[1]}"/><stop offset="1" stop-color="${c[2]}"/></radialGradient>`;}
defs+=`<radialGradient id="gIn" cx="50%" cy="44%" r="62%"><stop offset=".68" stop-color="#3a0012" stop-opacity="0"/><stop offset="1" stop-color="#3a0012" stop-opacity=".24"/></radialGradient>
<radialGradient id="gShine"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".5" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<radialGradient id="g_eye" cx="42%" cy="35%" r="70%"><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#E9DCE0"/></radialGradient>
<radialGradient id="gGlow"><stop offset="0" stop-color="#FFF3B0" stop-opacity=".9"/><stop offset="1" stop-color="#FFF3B0" stop-opacity="0"/></radialGradient>`;

function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const clay=(tag,attrs,col,sw=2.5)=>`<${tag} ${attrs} fill="url(#g_${col})" stroke="${C[col][2]}" stroke-opacity=".5" stroke-width="${sw}"/><${tag} ${attrs} fill="url(#gIn)"/>`;
const shine=(cx,cy,rx,ry,rot=-25,o=.85)=>`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" transform="rotate(${rot} ${cx} ${cy})" fill="url(#gShine)" opacity="${o}"/>`;
const pill=(x,y,w,h,col)=>clay('rect',`x="${x}" y="${y}" width="${w}" height="${h}" rx="${Math.min(w,h)/2}"`,col);
function spots(seed,n,x0,y0,x1,y1,col,r0=3,r1=7){const R=rng(seed);let s='';for(let i=0;i<n;i++){const x=x0+R()*(x1-x0),y=y0+R()*(y1-y0),r=r0+R()*(r1-r0);s+=`<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="${r.toFixed(1)}" ry="${(r*.6).toFixed(1)}" transform="rotate(${(R()*180).toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})" fill="${i%2?C[col][2]:'#fff'}" opacity="${i%2?.13:.18}"/>`;}return s;}
let UID=0;
const $=(e,s)=>e.querySelector(s), $$=(e,s)=>[...e.querySelectorAll(s)];
const A=(n,v)=>n&&n.setAttribute('transform',v);
function box(w,h,z,html,parent,css={}){const e=el('div',parent||null,Object.assign({left:'0px',top:'0px',width:w+'px',height:h+'px',zIndex:z},css),html);e._w=w;e._h=h;return e;}
function put(e,cx,cy,o={}){if(o.o!=null&&o.o<=0.001){e.style.visibility='hidden';return;}set(e,Object.assign({o:1},o,{x:cx-e._w/2,y:cy-e._h/2}));}
const hide=e=>{e.style.visibility='hidden'};
const blinkF=(t,ph=0,per=3.3)=>{const k=((t+ph)%per+per)%per;return k<0.16?Math.sin(k/0.16*Math.PI):0;};
const bump=(t,t0,d)=>(t<t0||t>t0+d)?0:Math.sin((t-t0)/d*Math.PI);
const F=(t,a,b,fi=.25,fo=.25)=>(t<a||t>b)?0:Math.min(clamp((t-a)/fi),clamp((b-t)/fo));
function star(x,y,r,c){return `<path d="M${x} ${y-r} Q${x+r*.18} ${y-r*.18} ${x+r} ${y} Q${x+r*.18} ${y+r*.18} ${x} ${y+r} Q${x-r*.18} ${y+r*.18} ${x-r} ${y} Q${x-r*.18} ${y-r*.18} ${x} ${y-r}Z" fill="${c}"/>`;}

 CEREBRO:{n:'Cerebro',bub:'#FF8FB8',tx:'#3A0C22',nm:'#9E1450',kb:'#3A0C22',kc:'#FFD6E6',tint:'#FFE0EC'},

};

 <g clip-path="url(#ec${u}_${i})"><g class="pup"><circle cx="${x}" cy="${y+2}" r="${(rx*.56).toFixed(1)}" fill="#22101A"/><circle cx="${(x-rx*.22).toFixed(1)}" cy="${(y-ry*.2).toFixed(1)}" r="${(rx*.21).toFixed(1)}" fill="#fff"/></g>
 <rect class="lid" x="${x-rx-3}" y="${y-ry-3}" width="${2*rx+6}" height="0" fill="${lidCol}"/></g>

 <path class="brow" d="M${x-rx*.9} ${y-ry-8} Q${x} ${y-ry-17} ${x+rx*.9} ${y-ry-8}" stroke="#3A0E1C" stroke-width="6" fill="none" stroke-linecap="round" data-cx="${x}" data-cy="${y-ry-12}" data-s="${side}"/>`}).join('');}

function brainPath(cx,cy,rx,ry,n){const P=[];for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n;P.push([cx+rx*Math.cos(a),cy+ry*Math.sin(a),a]);}

  </g>
  <g data-x="hat" opacity="0"><g transform="rotate(-16 150 80)"><path d="M114 84 L150 -10 L186 84 Z" fill="url(#g_violet)" stroke="#5A3E8A" stroke-width="3"/><circle cx="150" cy="26" r="7" fill="#FFE14D"/><circle cx="136" cy="58" r="7" fill="#FFE14D"/><circle cx="164" cy="64" r="7" fill="#FFE14D"/><circle cx="150" cy="-12" r="13" fill="url(#g_lemon)"/><path d="M110 82 Q150 92 190 82" stroke="#FFE14D" stroke-width="7" fill="none" stroke-linecap="round"/></g></g>
  <g data-x="ice" opacity="0"><g transform="rotate(-12 150 60)">${clay('path','d="M90 86 Q84 36 150 30 Q216 36 210 86 Q150 104 90 86Z"','blue',3)}<rect x="138" y="12" width="24" height="24" rx="6" fill="#fff" stroke="#55A8D2" stroke-width="3"/><rect x="112" y="50" width="22" height="20" rx="5" fill="#fff" opacity=".5"/><rect x="160" y="46" width="22" height="20" rx="5" fill="#fff" opacity=".5"/>${shine(118,48,18,7,-20)}</g></g>

 } else if(nm==='HIGADO'){
