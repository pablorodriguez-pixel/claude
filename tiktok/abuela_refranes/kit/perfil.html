<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Perfil TikTok — Por algo se dice</title>
<link rel="stylesheet" href="base.css">
<style>
  html, body { width: 1080px; height: 2340px; background: #fff; overflow: hidden; }
  #app { position: relative; width: 1080px; height: 2340px; background: #fff; font-family: InterV, sans-serif; color: #161823; }
  .status { height: 96px; display: flex; align-items: center; justify-content: space-between; padding: 0 56px; font-weight: 600; font-size: 40px; }
  .status .r { display: flex; gap: 18px; align-items: center; }
  .bar { display: inline-block; width: 8px; background: #161823; border-radius: 2px; margin-left: 4px; }
  .nav { height: 110px; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; }
  .nav .title { font-weight: 700; font-size: 44px; display: flex; align-items: center; gap: 10px; }
  .ico { width: 64px; height: 64px; }
  .avatar { display: block; margin: 26px auto 0; width: 290px; height: 290px; border-radius: 50%; box-shadow: 0 0 0 1px rgba(22,24,35,.12); }
  .name { text-align: center; font-weight: 700; font-size: 50px; margin-top: 30px; }
  .user { text-align: center; font-size: 38px; color: #161823; margin-top: 10px; font-weight: 500; }
  .stats { display: flex; justify-content: center; margin-top: 40px; }
  .stat { width: 250px; text-align: center; position: relative; }
  .stat b { display: block; font-size: 50px; font-weight: 700; }
  .stat span { font-size: 34px; color: rgba(22,24,35,.6); }
  .stat + .stat::before { content: ''; position: absolute; left: 0; top: 22px; height: 44px; border-left: 2px solid rgba(22,24,35,.12); }
  .btns { display: flex; justify-content: center; gap: 16px; margin-top: 44px; }
  .follow { width: 420px; height: 112px; border-radius: 10px; background: #FE2C55; color: #fff; font-weight: 700; font-size: 42px; display: flex; align-items: center; justify-content: center; }
  .sq { width: 112px; height: 112px; border-radius: 10px; background: #F1F1F2; display: flex; align-items: center; justify-content: center; }
  .bio { text-align: center; font-size: 38px; line-height: 1.38; margin: 40px 120px 0; font-weight: 400; }
  .tabs { display: flex; margin-top: 52px; border-bottom: 2px solid rgba(22,24,35,.12); }
  .tab { flex: 1; height: 120px; display: flex; align-items: center; justify-content: center; position: relative; }
  .tab.on::after { content: ''; position: absolute; bottom: -2px; width: 120px; height: 5px; background: #161823; border-radius: 3px; }
  .grid { display: grid; grid-template-columns: repeat(3, 358px); gap: 3px; }
  .grid canvas { display: block; width: 358px; height: 478px; }
  .bottom { position: absolute; left: 0; right: 0; bottom: 0; height: 190px; border-top: 1px solid rgba(22,24,35,.12); background: #fff;
            display: flex; justify-content: space-around; align-items: flex-start; padding-top: 22px; font-size: 26px; color: rgba(22,24,35,.55); }
  .bottom div { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 180px; }
  .bottom .me { color: #161823; font-weight: 700; }
  .plus { width: 116px; height: 74px; border-radius: 18px; background: #161823; position: relative; box-shadow: -7px 0 0 #25F4EE, 7px 0 0 #FE2C55; display: flex; align-items: center; justify-content: center; margin-top: 4px; }
</style></head>
<body><div id="app">
  <div class="status"><span>9:41</span><span class="r"><span><i class="bar" style="height:14px"></i><i class="bar" style="height:20px"></i><i class="bar" style="height:26px"></i><i class="bar" style="height:32px"></i></span>
    <svg class="ico" style="width:46px;height:46px" viewBox="0 0 24 24"><path d="M12 18.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Zm-4.2-4.1 1.4 1.4a4 4 0 0 1 5.6 0l1.4-1.4a6 6 0 0 0-8.4 0Zm-2.8-2.8 1.4 1.4a8 8 0 0 1 11.2 0l1.4-1.4a10 10 0 0 0-14 0Z" fill="#161823"/></svg>
    <svg viewBox="0 0 30 14" style="width:70px;height:34px"><rect x="1" y="1" width="24" height="12" rx="3" fill="none" stroke="#161823" stroke-width="1.6"/><rect x="3" y="3" width="18" height="8" rx="1.5" fill="#161823"/><rect x="26.5" y="4.5" width="2" height="5" rx="1" fill="#161823"/></svg></span></div>
  <div class="nav">
    <svg class="ico" viewBox="0 0 24 24"><path d="M15 5 8 12l7 7" fill="none" stroke="#161823" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="title">Por algo se dice <svg viewBox="0 0 24 24" style="width:34px;height:34px"><path d="m6 9 6 6 6-6" fill="none" stroke="#161823" stroke-width="2.4" stroke-linecap="round"/></svg></div>
    <div style="display:flex;gap:30px">
      <svg class="ico" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0-6 6v3.6L4.4 16h15.2L18 12.6V9a6 6 0 0 0-6-6Zm-2.4 15a2.4 2.4 0 0 0 4.8 0" fill="none" stroke="#161823" stroke-width="1.9" stroke-linejoin="round"/></svg>
      <svg class="ico" viewBox="0 0 24 24"><path d="M13 4.5 21 12l-8 7.5v-4.3C8 15.2 5 16.8 3 20c.6-5.4 3.6-9.6 10-10.4V4.5Z" fill="none" stroke="#161823" stroke-width="1.9" stroke-linejoin="round"/></svg>
    </div>
  </div>
  <img class="avatar" src="logo_avatar.png" alt="Logo de Por algo se dice">
  <div class="name">Por algo se dice</div>
  <div class="user">@poralgosedice</div>
  <div class="stats">
    <div class="stat"><b>0</b><span>Siguiendo</span></div>

    <div class="sq"><svg viewBox="0 0 24 24" style="width:44px;height:44px"><path d="m6 9 6 6 6-6" fill="none" stroke="#161823" stroke-width="2.4" stroke-linecap="round"/></svg></div>

    <div class="tab"><svg viewBox="0 0 24 24" style="width:50px;height:50px;opacity:.45"><rect x="5" y="10" width="14" height="10" rx="2" fill="none" stroke="#161823" stroke-width="1.9"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="#161823" stroke-width="1.9"/></svg></div>

  </div>
  <div class="grid"><canvas id="c0" width="358" height="478"></canvas><canvas id="c1" width="358" height="478"></canvas><canvas id="c2" width="358" height="478"></canvas></div>
  <div class="bottom">
    <div><svg viewBox="0 0 24 24" style="width:58px;height:58px"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4v-9Z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg>Inicio</div>
    <div><svg viewBox="0 0 24 24" style="width:58px;height:58px"><circle cx="9" cy="9" r="3.5" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M3 19c.8-3 3.2-4.5 6-4.5s5.2 1.5 6 4.5M16 6.5a3 3 0 1 1 0 5.5M18 14.5c1.6.6 2.6 2 3 4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>Amigos</div>

    <div class="me"><svg viewBox="0 0 24 24" style="width:58px;height:58px"><circle cx="12" cy="8.5" r="4" fill="#161823"/><path d="M4 20c1-4 4.2-6 8-6s7 2 8 6Z" fill="#161823"/></svg>Perfil</div>
  </div>

<script src="stitch.js"></script><script src="abuela.js"></script><script src="marco.js"></script>
<script>
// Portadas: primer fotograma del episodio (prod/ab0*/final.mp4 → perfil/cover_*.jpg) + título bordado grande + veredicto.
const T = Stitch.THREADS;
const COVERS = [
  { img: 'perfil/cover_ab01_sevilla.jpg', title: 'QUIEN SE\nFUE A\nSEVILLA', stamp: '¡MAL!', sc: T.rojo, views: '0' },
  { img: 'perfil/cover_ab02_mangas.jpg', title: '¡A BUENAS\nHORAS,\nMANGAS\nVERDES!', stamp: '¿QUIÉN?', sc: T.marino, views: '0' },
  { img: 'perfil/cover_ab03_babia.jpg', title: 'ESTAR\nEN BABIA', stamp: '¡EXISTE!', sc: T.verde, views: '0' },
];
const load = src => new Promise(res => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; });
(async () => {
  await document.fonts.ready;
  for (let i = 0; i < COVERS.length; i++) {
    const C = COVERS[i], cv = document.getElementById('c' + i), g = cv.getContext('2d');
    const im = await load(C.img);
    if (im) { const s = 358 / im.width, h = im.height * s; g.drawImage(im, 0, (478 - h) / 2 - 40, 358, h); }
    else Stitch.drawFabric(g, 0, 0, 358, 478, { cell: 8 });
    // velo para que el rótulo mande
    g.fillStyle = 'rgba(243,235,221,.55)'; g.fillRect(0, 0, 358, 478); g.fillStyle = 'rgba(243,235,221,.6)'; g.fillRect(0, 0, 358, 120);
    Marco.patch(g, 179, 205, C.title, { cell: 6, pad: 1, color: '#FBF6EE', border: T.granate, textColor: T.rojo, shadowColor: null, rot: -0.03 });
    Marco.patch(g, 255, 372, C.stamp, { cell: 4, pad: 1, color: C.sc, border: '#FFFFFF', textColor: '#FFFFFF', shadowColor: null, rot: 0.12 });
    // contador de reproducciones (UI de TikTok)
    g.fillStyle = 'rgba(0,0,0,.35)'; const gr = g.createLinearGradient(0, 400, 0, 478); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.45)'); g.fillStyle = gr; g.fillRect(0, 400, 358, 78);
    g.fillStyle = '#fff'; g.font = '600 30px InterV';
    g.beginPath(); g.moveTo(16, 444); g.lineTo(16, 468); g.lineTo(36, 456); g.closePath(); g.lineJoin = 'round'; g.strokeStyle = '#fff'; g.lineWidth = 3; g.stroke();
    g.fillText(C.views, 46, 467);
  }
  window.ready = true;
})();
</script>
</body></html>
