// ---------------------------------------------------------------- helpers de sprites
function G(w, h) {
  const a = [...Array(h)].map(() => Array(w).fill('.'));
  const o = {
    a, w, h,
    r(x0, y0, x1, y1, c) { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (a[y] && x >= 0 && x < w) a[y][x] = c; return o; },
    p(x, y, c) { if (a[y] && x >= 0 && x < w) a[y][x] = c; return o; },
    rows() { return a.map(r => r.join('')); },
  };
  return o;
}
// texto multicolor por tramos: lines = [[[str,color],...], ...]
function mtext(lines, o = {}) {
  const chars = 'abcdefghijklmnopqr'; const pal = {}; let ci = 0;
  const hasTop = str => [...str].some(c => { const gl = Stitch.FONT[c] || Stitch.FONT[c.toUpperCase()]; return gl && gl.top; }) ? 2 : 0;
  const built = lines.map(parts => {
    const P = parts.map(([str, col]) => { const ch = chars[ci++]; pal[ch] = col; const tr = Stitch.textRows(str, { ch, bold: o.bold }); const top = hasTop(str); return { rows: tr.rows, top, desc: tr.rows.length - 7 - top }; });
    const topM = Math.max(...P.map(p => p.top)), descM = Math.max(...P.map(p => p.desc)), HH = topM + 7 + descM;
    const out = [];
    for (let y = 0; y < HH; y++) out.push(P.map(p => { const yy = y - (topM - p.top); return p.rows[yy] || '.'.repeat(p.rows[0].length); }).join('.'));
    return out;
  });
  const W = Math.max(...built.map(b => b[0].length));
  let rows = [];
  built.forEach((b, i) => {
    const off = Math.floor((W - b[0].length) / 2);
    b.forEach(r => rows.push('.'.repeat(off) + r + '.'.repeat(W - r.length - off)));
    if (i < built.length - 1) rows.push('.'.repeat(W));
  });
  if (o.shadowColor) {
    pal.z = o.shadowColor;
    const g2 = rows.map(r => (r + '.').split('')); g2.push(Array(W + 1).fill('.'));
    for (let y = 0; y < rows.length; y++) for (let x = 0; x < W; x++) if (rows[y][x] !== '.' && g2[y + 1][x + 1] === '.') g2[y + 1][x + 1] = 'z';
    rows = g2.map(r => r.join(''));
  }
  return new Stitch.Sprite(rows, pal, Object.assign({ tails: 1 }, o));
}

// --- obispo en punto de cruz (old = tío con barba blanca; sit = sentado)
function bishopRows(old, sit) {
  const H = sit ? 32 : 37, cx = 10, sx = 19, b = G(24, H);

  b.r(sx, 4, sx, H - 2, 'Y');

  // mitra
  const hw = [0, 1, 2, 3, 4, 4, 4, 4];
  for (let y = 0; y < 8; y++) { b.r(cx - hw[y], y, cx + hw[y], y, 'w'); b.p(cx - hw[y], y, 'y'); b.p(cx + hw[y], y, 'y'); }
  b.r(cx - 4, 7, cx + 4, 7, 'y'); b.r(cx, 2, cx, 6, 'r'); b.r(cx - 1, 4, cx + 1, 4, 'r');
  // cara
  b.r(cx - 4, 8, cx + 4, 13, 'k'); b.r(cx - 3, 14, cx + 3, 14, 'k');
  b.r(cx - 3, 9, cx - 2, 9, old ? 'g' : 'B'); b.r(cx + 2, 9, cx + 3, 9, old ? 'g' : 'B');
  b.p(cx - 2, 10, 'e'); b.p(cx + 2, 10, 'e');
  b.p(cx - 3, 12, 'K'); b.p(cx + 3, 12, 'K');
  if (old) {
    b.r(cx - 2, 12, cx + 2, 12, 'g'); b.p(cx - 4, 12, 'g'); b.p(cx + 4, 12, 'g');
    b.r(cx - 4, 13, cx + 4, 13, 'g'); b.r(cx - 1, 13, cx + 1, 13, 'M');
    b.r(cx - 4, 14, cx + 4, 15, 'g'); b.r(cx - 3, 16, cx + 3, 16, 'g'); b.r(cx - 2, 17, cx + 2, 17, 'g'); b.r(cx - 1, 18, cx + 1, 18, 'g');
  } else { b.r(cx - 1, 13, cx + 1, 13, 'M'); b.p(cx - 2, 12, 'M'); b.p(cx + 2, 12, 'M'); }
  // casulla
  const end = sit ? 27 : 31;
  for (let y = 15; y <= end; y++) {
    const w = y === 15 ? 5 : y === 16 ? 6 : 7 + (y > 24 ? 1 : 0);
    for (let x = cx - w; x <= cx + w; x++) if (b.a[y][x] === '.') b.a[y][x] = (x === cx - w || x === cx + w) ? 'R' : 'r';
    for (let x = cx - 1; x <= cx + 1; x++) if (b.a[y][x] === 'r') b.a[y][x] = 'y';
  }
  if (!old) b.r(cx - 2, 15, cx + 2, 15, 'w');
  else { b.p(cx - 2, 15, 'g'); }
  // manos
  b.r(cx + 8, 20, cx + 8, 22, 'k'); b.r(cx - 8, 21, cx - 7, 22, 'k');
  // alba y zapatos
  b.r(cx - 7, end + 1, cx + 7, end + 2, 'w'); b.r(cx - 4, end + 3, cx - 2, end + 3, 'n'); b.r(cx + 2, end + 3, cx + 4, end + 3, 'n');
  return b.rows();
}

const SCROLL = new Stitch.Sprite(scrollRows(), { e: '#F6F1E8', E: '#CBC1B1', b: T.marron, G: T.gris, r: T.rojo, R: T.granate }, { cell: 8, outline: 'outer', outlineColor: '#3B2A22', tails: 0, seed: 8 });

}

// --- mapa de España bordado
const SPAIN = [[-9.3, 43.0], [-8.9, 43.35], [-8.3, 43.55], [-7.7, 43.78], [-6.5, 43.57], [-5.8, 43.62], [-4.5, 43.42], [-3.8, 43.48], [-2.9, 43.38], [-1.8, 43.37], [-1.4, 43.05], [-0.7, 42.85], [0.7, 42.83], [1.7, 42.45], [3.17, 42.43], [3.3, 42.3], [3.2, 41.9], [2.2, 41.4], [1.0, 41.05], [0.7, 40.75], [0.5, 40.55], [-0.1, 39.9], [-0.3, 39.45], [0.0, 38.95], [0.2, 38.75], [-0.5, 38.35], [-0.75, 37.85], [-0.8, 37.6], [-1.3, 37.55], [-1.65, 37.35], [-1.9, 36.95], [-2.15, 36.72], [-2.9, 36.75], [-3.5, 36.72], [-4.4, 36.72], [-4.95, 36.48], [-5.35, 36.15], [-5.6, 36.0], [-6.05, 36.3], [-6.3, 36.55], [-6.4, 36.8], [-6.95, 37.2], [-7.4, 37.2], [-7.5, 37.5], [-7.0, 38.0], [-7.3, 38.4], [-7.0, 38.9], [-7.5, 39.6], [-7.0, 39.65], [-6.9, 40.2], [-6.85, 41.0], [-6.45, 41.65], [-6.7, 41.95], [-8.1, 41.85], [-8.2, 42.1], [-8.9, 41.88], [-8.85, 42.2], [-9.0, 42.5]];
const PORT = [[-8.9, 41.88], [-8.2, 42.1], [-8.1, 41.85], [-6.7, 41.95], [-6.45, 41.65], [-6.85, 41.0], [-6.9, 40.2], [-7.0, 39.65], [-7.5, 39.6], [-7.0, 38.9], [-7.3, 38.4], [-7.0, 38.0], [-7.5, 37.5], [-7.4, 37.2], [-7.9, 37.0], [-8.6, 37.1], [-8.95, 37.0], [-8.8, 37.9], [-8.8, 38.5], [-9.5, 38.75], [-9.3, 39.3], [-9.0, 39.9], [-8.75, 40.6], [-8.8, 41.3]];
const MSC = 6.34, MX = 168, MY = 336;
const proj = (lon, lat) => [(lon + 9.7) * 0.77 * MSC, (44.0 - lat) * MSC];
function inPoly(x, y, poly) { let c = false; for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) { const [xi, yi] = poly[i], [xj, yj] = poly[j]; if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c; } return c; }
function mapRows() {
  const SP = SPAIN.map(p => proj(...p)), PT = PORT.map(p => proj(...p));
  const Wc = 64, Hc = 52, b = G(Wc, Hc);
  const at = (x, y) => (inPoly(x + 0.5, y + 0.5, SP) ? 's' : inPoly(x + 0.5, y + 0.5, PT) ? 'p' : '.');
  for (let y = 0; y < Hc; y++) for (let x = 0; x < Wc; x++) b.p(x, y, at(x, y));
  const out = b.rows().map(r => r.split(''));
  for (let y = 0; y < Hc; y++) for (let x = 0; x < Wc; x++) {
    const c = b.a[y][x]; if (c === '.') continue;
    const nb = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => (b.a[y + dy] ? b.a[y + dy][x + dx] : '.') !== c);
    if (nb) out[y][x] = c === 's' ? 'S' : 'P';
  }

}
const MAP = new Stitch.Sprite(mapRows(), { s: '#5BA672', S: T.verde, p: '#C9CBC8', P: T.gris }, { cell: CELL, tails: 0, seed: 31 });
const cityPx = (lon, lat) => { const [x, y] = proj(lon, lat); return [MX + x * CELL, MY + y * CELL]; };
const SANT = cityPx(-8.54, 42.88), SEV = cityPx(-5.98, 37.39);
const ROUTE = Stitch.catmull([SEV, [SEV[0] - 150, lerp(SEV[1], SANT[1], 0.45)], [SANT[0] + 40, SANT[1] + 120], SANT], 14);
function pathAt(P, u) { // punto en la ruta (u 0..1 por longitud)
  if (!P._len) { P._acc = [0]; for (let i = 1; i < P.length; i++) P._acc.push(P._acc[i - 1] + Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1])); P._len = P._acc[P._acc.length - 1]; }
  const d = clamp(u) * P._len; let i = 1; while (i < P.length - 1 && P._acc[i] < d) i++;
  const k = (d - P._acc[i - 1]) / ((P._acc[i] - P._acc[i - 1]) || 1);
  return [lerp(P[i - 1][0], P[i][0], k), lerp(P[i - 1][1], P[i][1], k)];

function runStitch(P, k, col = T.rojo, wid = 7) { // puntada corrida a lo largo de P
  if (k <= 0) return; pathAt(P, 0); const L = P._len * clamp(k), step = 30, dash = 19;
  for (let d = 0; d < L; d += step) { const a = pathAt(P, d / P._len), b = pathAt(P, Math.min(d + dash, L) / P._len); Stitch.drawThread(g, [a, b], { color: col, width: wid, smooth: false, shadowA: 0.22 }); }
}

// --- dechado con cenefa
function cenefaRows(W, H, B = 5) {
  const b = G(W, H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const v = Math.min(x, y, W - 1 - x, H - 1 - y); if (v >= B) continue;
    const s = (y < B || y >= H - B) ? x : y;
    if (v === 0 || v === B - 1) { if ((s + v) % 2 === 0) b.p(x, y, 'R'); continue; }
    const u = ((s % 8) + 8) % 8, d = Math.abs(u - 3) + Math.abs(v - 2);

  }
  return b.rows();
}

// ---------------------------------------------------------------- la abuela
const HR = 340;
function hoopPose(t) {
  const BIG = { x: 540, y: 1090, s: 0.84 }, MAR = { x: 540, y: 955, s: 1 }, SM = { x: 196, y: 1150, s: 0.48 }, MED = { x: 300, y: 560, s: 0.62 };
