<script>
/* «Ya lo decía la abuela» — REFRÁN Nº 3: ESTAR EN BABIA */
const cv = document.getElementById('cv'), g = cv.getContext('2d');
const T = Stitch.THREADS, CELL = 14, PI = Math.PI;

const ap = (t, t0, d = 0.4) => (t < t0 ? 0 : E.outBack(clamp((t - t0) / d)));            // aparición con rebote
const gone = (t, t1, d = 0.2) => 1 - E.inCubic(clamp((t - t1) / d));                     // salida rápida
const kk = (t, t0, d) => clamp((t - t0) / d);
const live = (t, a, b) => t >= a && t < b;
const bump = (t, t0, d = 0.45, a = 0.07) => (t < t0 || t > t0 + d ? 0 : Math.sin(PI * (t - t0) / d) * a * (1 - (t - t0) / d * 0.5));
const LBL = (txt, o = {}) => Object.assign({ cell: 7, pad: 1, color: T.marino, border: T.mostaza, textColor: '#FFFFFF', shadowColor: null }, o);

// ------------------------------------------------------------------ SPRITES (una vez)
const TT1 = Stitch.textSprite('ESTAR EN', { cell: 16, color: T.rojo, shadowColor: T.granate, seed: 3 });
const TT2 = Stitch.textSprite('BABIA', { cell: 30, color: T.rojo, shadowColor: T.granate, seed: 5 });
const HOLA = Stitch.textSprite('POR ALGO\nSE DICE', { cell: 17, color: T.rojo, shadowColor: T.granate, seed: 8 });
const NOES = Stitch.textSprite('NO ES UN SITIO\nCUALQUIERA', { cell: 12, color: T.marino, shadowColor: sh2(T.marino), seed: 9 });

const PREG = Stitch.textSprite('¿TÚ SABÍAS\nQUE EXISTÍA?', { cell: 15, color: T.rojo, shadowColor: T.granate, seed: 14, colors: [T.marino, T.rojo] });
const ZZZ = Stitch.textSprite('Z', { cell: 10, color: T.azul, seed: 15 });

const PIN = BS.pin(), SIGN = BS.roadSign(), CROWN = BS.crown(), HAMMOCK = BS.hammock(), SHIELD = BS.shield();
const DEER = BS.deer(), DOG = BS.dog(), CASTLE = BS.castle(), STORM = BS.storm();
const PAPERS = [0, 1, 2, 3, 4, 5].map(i => BS.paper(i));
const THRONE = BS.throne(), WEB = BS.cobweb(), SPIDER = BS.spider(), CLOUD = BS.cloud(1), CLOUD2 = BS.cloud(2);

const COW = BS.cow(), HORSE = BS.horse(), HEART = BS.heart(), CUP = BS.teacup(), CHAIR = BS.chair();
const MAP = BS.spainMap();
const ICONS = [BS.iconSilla(), BS.iconManga(), BS.iconMontana()];
const KING = BS.person({ crown: 1, cape: 'r', tunic: 'n', tunic2: 'm', beard: 'b', hair: 'b' }).sprite({ cell: 11, seed: 201 });
const KING_SLEEP = BS.person({ crown: 1, cape: 'r', tunic: 'n', tunic2: 'm', beard: 'b', hair: 'b', eyes: 'closed' }).sprite({ cell: 11, seed: 201 });
const KING_HUNT = BS.person({ crown: 1, cape: 'r', tunic: 'n', tunic2: 'm', beard: 'b', hair: 'b', arm: 'point', brows: 'up', mouth: 'grin' }).sprite({ cell: 11, seed: 201 });
const KING_NOHEAD = BS.person({ cape: 'r', tunic: 'n', tunic2: 'm', noHead: 1 }).sprite({ cell: 11, seed: 202 });
const COURT = BS.person({ hat: 'n', tunic: 'a', collar: 1, hair: 'b', arm: 'up' }).sprite({ cell: 11, seed: 203 });
const COURT_O = BS.person({ hat: 'n', tunic: 'a', collar: 1, hair: 'b', arm: 'up', eyes: 'wide', mouth: 'o', brows: 'up' }).sprite({ cell: 11, seed: 203 });
const CHAMB = BS.person({ bald: 1, hair: 'h', tunic: 'R', mustache: 'G', collar: 1, arm: 'up', mouth: 'smile' }).sprite({ cell: 11, seed: 204 });
const CHAMB_T = BS.person({ bald: 1, hair: 'h', tunic: 'R', mustache: 'G', collar: 1, arm: 'up', mouth: 'grin', eyes: 'happy' }).sprite({ cell: 11, seed: 204 });
const BOSS = BS.person({ hair: 'k', tunic: 'G', tie: 1, arm: 'point', brows: 'up', mouth: 'o' }).sprite({ cell: 11, seed: 205 });
// compás «N»
const NORTH = (() => { const G = BS.Grid(13, 20); G.poly([[6.5, 0], [11, 11], [6.5, 8.5], [2, 11]], 'r'); G.poly([[6.5, 0], [6.5, 8.5], [2, 11]], 'R'); G.text(4, 12, 'N', 'n'); return G.sprite({ cell: 12, seed: 301 }); })();
// gota de sudor
const DROP = (() => { const G = BS.Grid(5, 7); G.stamp(0, 0, ['..a..', '.aca.', '.aca.', 'aaacc', 'aaaac', 'aaaaa', '.aaa.']); return G.sprite({ cell: 11, seed: 302 }); })();
// estrellita
const STAR = (() => { const G = BS.Grid(7, 7); G.stamp(0, 0, ['...m...', '..mmm..', 'mmmmmmm', '.mmmmm.', '..mmm..', '.mm.mm.', 'm.....m']); return G.sprite({ cell: 11, seed: 303, outline: false }); })();
// DECHADO de la colección (4x3)
const DCH = (() => {
  const W = 84, H = 80, G = BS.Grid(W, H);
  for (let x = 0; x < W; x++) for (let y = 0; y < H; y++) {
    const edge = x < 3 || y < 3 || x >= W - 3 || y >= H - 3;
    if (edge) { const m = (x + y) % 4; G.px(x, y, (x < 1 || y < 1 || x >= W - 1 || y >= H - 1) ? 'R' : (m === 0 ? 'v' : m === 2 ? 'r' : '.')); }
  }
  G.text(15, 5, 'COLECCIÓN', 'R'); G.text(6, 15, 'DE LA ABUELA', 'R');
  for (let r = 0; r < 3; r++) for (let c = 0; c < 4; c++) {
    const x0 = 5 + c * 19, y0 = 25 + r * 18.5 | 0;
    for (let i = 0; i < 17; i++) { if (i % 2 === 0) { G.px(x0 + i, y0, 'g'); G.px(x0 + i, y0 + 16, 'g'); G.px(x0, y0 + i, 'g'); G.px(x0 + 16, y0 + i, 'g'); } }
    if (r * 4 + c >= 3) G.text(x0 + 6, y0 + 5, '?', 'h');
  }
  return G.sprite({ cell: 9, seed: 401, outline: false, tails: 2 });
})();
const DX = 162, DY = 270;                                     // origen del dechado
const boxC = i => { const r = Math.floor(i / 4), c = i % 4; return [DX + (5 + c * 19 + 8.5) * 9, DY + ((25 + r * 18.5 | 0) + 8.5) * 9]; };

// ------------------------------------------------------------------ TIEMPOS (v2: clavados por texto)
const F = (s, from = 0) => w(find(s, from)), FE = (s, from = 0) => we(find(s, from));
const iL = n => WD.findIndex(x => x.line === n);
const tA = { babia: F('babia'), existe: F('existe'), es: F('es un sitio'), verdad: F('verdad'), y: F('y puedes'), ir: w(find('puedes ir') + 1) + 0.15 };
const tB = { y: F('y no es') - 0.08, cualq: F('cualquiera'), era: F('era donde'), reyes: F('los reyes a') + 0.21, desc: F('desconectar') };
const tC = { soy: F('soy la abuela'), remedios: F('remedios'), esto: F('y esto'), por: F('por algo se dice'), dice: F('se dice') + 0.2 };
const iD = iL(3), iE = iL(4), iF = iL(5), iG = iL(6), iH = iL(7), iI = iL(8), iJ = iL(9), iK = iL(10), iLl = iL(11);
const tD = { babia: w(iD), comarca: F('comarca', iD), montana: F('montana', iD), norte: F('norte', iD), leon: F('leon', iD) };
const tE = { en: w(iE) - 0.1, edad: F('edad media', iE), reyes: F('reyes', iE), leon: F('leon', iE), desc: F('descansar', iE), cazar: F('cazar', iE), lejos: F('lejos', iE), corte: F('corte', iE), probl: F('problemas', iE) };
const tF = { y: w(iF) - 0.1, palacio: F('palacio', iF), alguien: F('alguien', iF), rey: F('rey', iF), contest: F('contestaban', iF), elrey: F('el rey esta', iF), babia: F('babia', iF) };
const tG = { o: w(iG), noesta: F('no esta', iG), ni: F('ni se', iG), espera: F('espera', iG), con: F('con la cabeza', iG), cabeza: F('cabeza', iG), otra: F('otra parte', iG) };
const tH = { y: w(iH) - 0.1, babia: F('babia', iH), estar: F('estar en las', iH), nubes: F('nubes', iH), como: F('como tu', iH), hablo: F('hablo', iH), eh: F('eh', iH) };
const tI = { ojo: w(iI), mas: F('mas aceptada', iI), pero: F('pero', iI), tiene: F('tiene', iI), leyenda: F('leyenda', iI) };
const tJ = { hoy: w(iJ) - 0.1, reserva: F('reserva', iJ), asi: F('asi que', iJ), alguien: F('alguien', iJ), estas: F('estas en', iJ), tu: F('tu contestas', iJ), ojala: F('ojala', iJ) };
const iSi = find('si o no', iK);
const tK = { tu: w(iK) - 0.1, existia: F('existia', iK), dime: F('dime', iK), si: w(iSi), no: w(iSi + 2) };
const tL = { y: w(iLl), sigueme: F('sigueme', iLl), cada: F('cada dia', iLl), cuento: F('cuento', iLl), otro: F('otro', iLl), porque: F('porque', iLl), dice: F('se dice', iLl) };
const tEnd = END + 0.05, DUR = END + 3.2;
const WIPES = [[tB.y, 'floral'], [tE.en, 'pana'], [tF.y, 'vichy'], [tH.y, 'floral'], [tJ.hoy, 'pana'], [tK.tu, 'vichy']];
// punch-ins (1 → 1,12) en palabras clave
const PUNCH = [tA.existe, tA.verdad, tA.ir - 0.15, tB.cualq, tB.desc, tC.remedios, tC.por, tD.babia + 0.3, tD.montana, tD.leon, tE.reyes, tE.cazar, tE.probl,
  tF.rey, tF.babia, tG.noesta, tG.espera, tG.cabeza, tH.babia, tH.nubes, tH.eh, tI.ojo, tI.mas, tI.leyenda, tJ.reserva, tJ.estas, tJ.ojala, tK.existia, tK.si, tK.no, tL.sigueme, tL.otro, tL.dice];
function punchZ(t) { let z = 1; for (const p of PUNCH) { const u = (t - p) / 0.38; if (u >= 0 && u < 1) z += 0.12 * (1 - E.outCubic(u)); } return z; }

// ------------------------------------------------------------------ SFX
sfx('stitch', 0.0, 0.7); sfx('stamp', tA.existe + 0.02, 1.0); sfx('sewing_machine', 0.15, 0.4);
sfx('stamp', tA.verdad + 0.05, 0.75); sfx('swoosh_up', tA.y, 0.6); sfx('boing', tA.ir, 0.5);
WIPES.forEach(([t0]) => sfx('cloth_whoosh', t0 - 0.12, 0.8));
sfx('sparkle', tB.y + 0.15, 0.6); sfx('scratch', tB.cualq + 0.1, 0.5); sfx('knit', tB.era, 0.6); sfx('stamp', tB.desc + 0.15, 0.7);
sfx('swoosh_up', tC.soy - 0.2, 0.6); sfx('pop', tC.remedios, 0.6); sfx('sewing_machine', tC.esto, 0.6); sfx('thread_pull', tC.dice - 0.3, 1.0); sfx('whoosh', tC.dice + 0.45, 0.5);
sfx('stitch', tD.babia - 0.1, 0.7); sfx('thud', tD.babia + 0.3, 0.7); sfx('whoosh', tD.comarca - 0.15, 0.6); sfx('stamp', tD.comarca + 0.25, 0.6); sfx('pop', tD.norte, 0.6);
sfx('stamp', tE.edad, 0.6); sfx('stitch', tE.reyes, 0.6); sfx('pop', tE.leon, 0.6); sfx('swoosh_up', tE.cazar - 0.2, 0.6); sfx('boing', tE.cazar + 0.4, 0.4);
sfx('whoosh', tE.lejos, 0.5); sfx('thud', tE.probl, 0.7); sfx('paper', tE.probl + 0.2, 0.7);
sfx('pop', tF.alguien, 0.5); sfx('pop2', tF.rey - 0.1, 0.7); sfx('pop', tF.contest, 0.5);
sfx('stamp', tF.babia - 0.45, 1.0); sfx('glitch', tF.babia - 0.45, 0.4);
sfx('swoosh_up', tG.o, 0.5); sfx('boing', tG.noesta + 0.1, 0.5); sfx('stamp', tG.ni + 0.1, 0.6); sfx('whoosh', tG.con, 0.5); sfx('sparkle', tG.otra, 0.5);
sfx('stitch', tH.y + 0.1, 0.6); sfx('pop', tH.estar, 0.6); sfx('swoosh_up', tH.nubes - 0.2, 0.5); sfx('msg_in', tH.como + 0.15, 0.8); sfx('msg_in', tH.hablo, 0.6); sfx('boing', tH.eh, 0.5);
sfx('stamp', tI.ojo, 0.9); sfx('ding', tI.mas + 0.1, 0.6); sfx('stamp', tI.leyenda - 0.25, 0.8);
sfx('stitch', tJ.hoy + 0.1, 0.6); sfx('sparkle', tJ.reserva + 0.2, 0.6); sfx('pop', tJ.alguien, 0.6); sfx('pop2', tJ.estas, 0.7); sfx('stamp', tJ.ojala, 1.0); sfx('tada', tJ.ojala + 0.1, 0.5);
sfx('stitch', tK.tu + 0.1, 0.6); sfx('pop', tK.dime, 0.7); sfx('ding', tK.si, 0.7); sfx('click', tK.no, 0.8); sfx('msg_in', tK.no + 0.4, 0.6);
sfx('stitch', tL.sigueme - 0.1, 0.8); sfx('ding', tL.sigueme + 0.4, 0.7); sfx('cloth_whoosh', tL.cada - 0.15, 0.6);
sfx('stitch', tL.otro - 0.2, 0.9); sfx('sparkle', tL.porque, 0.5); sfx('snip', tL.dice + 0.15, 1.0);
sfx('cloth_whoosh', tEnd - 0.15, 0.7); sfx('ding', tEnd + 1.3, 0.7);

// ------------------------------------------------------------------ BASTIDOR DE LA ABUELA (keyframes)
const HR = 380;
const P_MED = [540, 1062, 0.66], P_SMALL = [188, 1172, 0.395], P_BIG = [540, 880, 0.92], P_BIG2 = [540, 790, 0.86], P_OJO = [540, 1040, 0.62],
  P_OJALA = [540, 850, 0.74], P_FOLLOW = [300, 720, 0.6];
const HK = [[0, P_MED], [tB.y - 0.1, P_MED], [tB.y + 0.15, P_SMALL], [tC.soy - 0.25, P_SMALL], [tC.soy, P_BIG], [tC.dice + 0.45, P_BIG], [tC.dice + 0.7, P_SMALL],
  [tH.como - 0.15, P_SMALL], [tH.como + 0.08, P_BIG2], [tI.ojo - 0.12, P_BIG2], [tI.ojo + 0.1, P_OJO], [tJ.hoy - 0.12, P_OJO], [tJ.hoy + 0.12, P_SMALL],
  [tJ.ojala - 0.2, P_SMALL], [tJ.ojala - 0.02, P_OJALA], [tK.tu - 0.1, P_OJALA], [tK.tu + 0.12, P_SMALL],
  [tL.y - 0.15, P_SMALL], [tL.y + 0.1, P_FOLLOW], [tL.cada - 0.15, P_FOLLOW], [tL.cada + 0.12, P_SMALL], [99, P_SMALL]];
function hoopPose(t) {
  for (let i = 0; i < HK.length - 1; i++) {
    const [a, A] = HK[i], [b, B] = HK[i + 1];
    if (t >= a && t < b) { const u = E.inOutCubic(clamp((t - a) / Math.max(0.001, b - a))); return [lerp(A[0], B[0], u), lerp(A[1], B[1], u), lerp(A[2], B[2], u)]; }
  }
  return P_SMALL;
}
function abState(t) {
  const st = { mouth: Abuela.lipsync(t, WD, { rest: 'smile' }), blink: Abuela.blink(t) };
  const L = (a, b) => t >= a && t < b;
  if (L(0, 1.0) || L(tA.existe, tA.existe + 0.6) || L(tA.verdad, tA.y)) st.brows = 'up';
  if (L(tA.verdad + 0.4, tA.y)) st.wink = true;
  if (L(tB.y, tB.era)) { st.hand = 'finger'; st.brows = 'skeptic'; }
  if (L(tB.reyes, tB.desc + 1)) st.brows = 'up';
  if (L(tC.remedios, tC.remedios + 0.5)) st.wink = true;
  if (L(tC.esto, tC.dice + 0.7)) { st.hand = 'thread'; if (t > tC.dice - 0.35) { st.brows = 'skeptic'; st.glassesDown = true; } }
  if (L(tD.babia + 0.15, tD.babia + 0.8)) st.brows = 'up';
  if (L(tE.cazar, tE.lejos)) st.brows = 'up';
  if (L(tE.probl, tE.probl + 0.9)) st.brows = 'skeptic';
  if (L(tF.babia - 0.5, tF.babia + 0.9)) st.brows = 'up';
  if (L(tG.noesta, tG.espera)) st.glassesDown = true;
  if (L(tH.como, tI.ojo)) { st.glassesDown = true; st.brows = 'skeptic'; }
  if (L(tH.eh, tH.eh + 0.6)) { st.wink = true; st.brows = 'normal'; }
  if (L(tI.ojo, tI.pero)) { st.hand = 'finger'; st.glassesDown = true; st.brows = 'up'; }
  if (L(tI.leyenda, tI.leyenda + 0.6)) st.wink = true;
  if (L(tJ.estas, tJ.tu)) st.brows = 'up';
  if (L(tJ.ojala, tJ.ojala + 1.0)) { st.mouth = 'laugh'; st.blink = true; }
  if (L(tK.tu, tK.dime)) st.brows = 'up';
  if (L(tK.dime, tL.y)) { st.hand = 'finger'; st.look = 1; }
  if (L(tL.y, tL.cada)) { st.hand = 'finger'; st.look = 1; }
  if (L(tL.dice, DUR)) st.wink = true;
  return st;
}
let HOOP = null; // info del bastidor del fotograma actual
function drawAbuela(t) {
  if (t >= tEnd + 0.4) return;
  const [x, y, s] = hoopPose(t), st = abState(t);
  let sway = Math.sin(t * 1.6) * 0.012;
  if (live(t, tC.soy, tC.remedios + 0.6)) sway += Math.sin((t - tC.soy) * 14) * 0.05 * (1 - kk(t, tC.soy, 1.2));   // saludo
  const pk = 1 + bump(t, tJ.ojala, 0.5, 0.08) + bump(t, tH.eh, 0.4, 0.05) + bump(t, tI.ojo, 0.4, 0.05);
  HOOP = Marco.abuelaHoop(g, x, y, HR, st, { t, scale: s * pk, rot: sway, skirt: true });
  HOOP.cx = x; HOOP.cy = y; HOOP.s = s;
}

// ------------------------------------------------------------------ AYUDAS DE DIBUJO
function spr(S, x, y, k, o = {}) {      // sprite centrado: k = progreso de bordado (1 = hecho)
  const opt = Object.assign({ anchor: [0.5, 0.5] }, o);
  if (k >= 1) S.draw(g, x, y, opt); else if (k > 0) S.stitchIn(g, x, y, k, Object.assign({ order: 'rows', needle: true, t: o.t || 0 }, opt));
}
const FRONT = [];
function patch(x, y, txt, k, o = {}) {   // los rótulos van siempre en la capa delantera (por encima del bastidor)
  k = clamp(k * 1.6); if (k <= 0) return;
  const tr = g.getTransform(), al = g.globalAlpha, tt = CUR_T;
  FRONT.push(() => { g.save(); g.setTransform(tr); g.globalAlpha = al; Marco.patch(g, x, y, txt, Object.assign({ k, t: tt }, o)); g.restore(); });
}
function flushFront() { while (FRONT.length) FRONT.shift()(); }
let CUR_T = 0;
function wipe(t, tc, kind) {
  const d = 0.26, u = (t - (tc - d / 2)) / d; if (u <= 0 || u >= 1) return;
  const x = 1080 - E.inOutCubic(u) * 2560;
  g.save(); g.beginPath(); g.moveTo(x + 150, 0); g.lineTo(x + 1420, 0); g.lineTo(x + 1270, 1920); g.lineTo(x, 1920); g.closePath();
  g.save(); g.clip(); Marco.drawBg(g, kind, 0, 0, 1080, 1920, kind === 'pana' ? { color: T.mostaza } : {}); g.restore();
  g.lineWidth = 14; g.strokeStyle = T.granate; g.beginPath(); g.moveTo(x + 150, 0); g.lineTo(x, 1920); g.moveTo(x + 1420, 0); g.lineTo(x + 1270, 1920); g.stroke();
  g.setLineDash([18, 14]); g.lineWidth = 4; g.strokeStyle = '#FFF8EC'; g.beginPath(); g.moveTo(x + 172, 0); g.lineTo(x + 22, 1920); g.moveTo(x + 1398, 0); g.lineTo(x + 1248, 1920); g.stroke(); g.setLineDash([]);
  g.restore();
}
function cam(t, cx, cy, z, fn) { g.save(); g.translate(cx, cy); g.scale(z, z); g.translate(-cx, -cy); fn(); g.restore(); }
function bubble(x, y, txt, k, o = {}) {   // bocadillo de tela con piquito
  if (k <= 0) return;
  const s = Marco.patchSize(txt, Object.assign({ cell: 9, pad: 2 }, o));
  const tx = o.tail || [x - s.w * 0.25, y + s.h * 0.5 + 50];
  const p = E.outBack(clamp(k / 0.18));
  g.save(); g.globalAlpha *= clamp(k * 6);
  g.fillStyle = o.color || '#FFFFFF'; g.strokeStyle = o.border || T.marino; g.lineWidth = 7;

      if (sd > 0) { const sy = 340 + sd * 260 + Math.sin(t * 3) * 6; g.save(); g.strokeStyle = '#7C8288'; g.lineWidth = 2; g.beginPath(); g.moveTo(640, 330); g.lineTo(640, sy); g.stroke(); g.restore(); SPIDER.draw(g, 640, sy, { anchor: [0.5, 0.2], scale: 1.2 }); }
    });
    patch(540, 300, 'NO ESTÁ', kk(t, tG.noesta, 0.8), { cell: 11, color: T.rojo, border: '#FFFFFF', textColor: '#FFFFFF', shadowColor: T.granate, rot: -0.04 });
    patch(660, 1120, 'NI SE LE ESPERA', kk(t, tG.ni + 0.05, 0.9), { cell: 8, color: T.marino, border: T.mostaza, textColor: '#FFFFFF', shadowColor: null, rot: 0.04 });
    return;
  }
  // el rey con la cabeza en una nube
  const kc = E.outBack(kk(t, tG.con - 0.1, 0.45));

  const x = 540, y = 900;

  const lift = E.outCubic(kk(t, tG.cabeza, 0.6)) * 40 + E.inOutCubic(kk(t, tG.otra, 0.8)) * 70 + Math.sin(t * 2.5) * 10;
  g.save(); g.strokeStyle = '#9AA0A6'; g.lineWidth = 5; g.setLineDash([10, 10]); g.beginPath(); g.moveTo(x, y - 40); g.lineTo(x + Math.sin(t * 1.7) * 14, y - 80 - lift); g.stroke(); g.restore();
  CLOUD.draw(g, x + Math.sin(t * 1.7) * 14, y - 130 - lift, { anchor: [0.5, 0.5], scale: 1.45 * kc });
  // pajaritos/estrellas alrededor de la nube
  for (let i = 0; i < 3; i++) { const a = t * 2.2 + i * 2.09; STAR.draw(g, x + Math.cos(a) * 260, y - 140 - lift + Math.sin(a) * 60, { anchor: [0.5, 0.5], scale: 0.55 }); }
  g.restore();
  patch(560, 330, 'LA CABEZA EN\nOTRA PARTE', kk(t, tG.cabeza - 0.1, 0.9), { cell: 9, color: T.azul, border: '#FFFFFF', textColor: '#FFFFFF', shadowColor: Stitch.shade(T.azul, -0.4), rot: -0.03 });
}
function sceneH(t) {   // DE AHÍ… DISTRAÍDO, EN LAS NUBES
  if (t >= tH.como - 0.2) {                                          // como tú cuando te hablo
    const s = ap(t, tH.como + 0.05, 0.45);
    if (s > 0) {
      const ping = (t > tH.como + 0.4 ? 1 : 0) + (t > tH.hablo ? 1 : 0);
      PHONE.draw(g, 830, 1100, { anchor: [0.5, 0.5], scale: 1.0 * s, rot: 0.14 + Math.sin(t * 2) * 0.03 });
      if (ping) patch(870, 880, ping > 1 ? '2' : '1', 1, { cell: 7, color: T.rojo, border: '#FFFFFF', textColor: '#FFFFFF', shadowColor: null, shape: 'circle', scale: 1 + bump(t, ping > 1 ? tH.hablo : tH.como + 0.4, 0.3, 0.3) });
    }
    patch(540, 290, '¿EH?', kk(t, tH.eh - 0.05, 0.6), { cell: 12, color: T.rojo, border: '#FFFFFF', textColor: '#FFFFFF', shadowColor: T.granate, rot: -0.08 });

  }
  const kd = kk(t, tH.y + 0.05, 0.5);
  const z = 1 + bump(t, tH.babia, 0.45, 0.06);

  });
  const ke = ap(t, tH.estar - 0.1, 0.4);
  if (ke > 0) IGUAL.draw(g, 540, 640, { anchor: [0.5, 0.5], scale: ke });
  patch(540, 770, 'EN LAS NUBES', kk(t, tH.estar - 0.05, 0.6), { cell: 12, color: T.azul, border: '#FFFFFF', textColor: '#FFFFFF', shadowColor: Stitch.shade(T.azul, -0.4), rot: -0.04 });

  const kn = kk(t, tH.estar + 0.2, 0.6);

}
function sceneI(t) {   // OJO
  const out1 = gone(t, tI.pero - 0.1, 0.2);
  patch(330, 350, '¡OJO!', kk(t, tI.ojo - 0.05, 0.7) * out1, { cell: 13, bold: true, color: T.rojo, border: '#FFFFFF', textColor: '#FFFFFF', shadowColor: T.granate, rot: -0.12 });
  if (t >= tI.mas - 0.15 && out1 > 0) {

    patch(460, 590, 'LA MÁS\nACEPTADA', kk(t, tI.mas, 0.8) * out1, { cell: 10, color: T.marino, border: T.mostaza, textColor: '#FFFFFF', shadowColor: null, rot: 0.03 });
  }

    patch(540, 330, 'SU PARTE DE...', kk(t, tI.tiene, 0.7), LBL('', { cell: 7 }));

function sceneJ(t) {   // RESERVA DE LA BIOSFERA → ¡OJALÁ!
  if (t < tJ.asi - 0.05) {
    const kl = kk(t, tJ.hoy + 0.05, 0.5), z = 1 + (t - tJ.hoy) * 0.02;

  if (t < tJ.ojala - 0.25) {    // alguien te dice: ¡estás en Babia!

  patch(540, 330, '¡OJALÁ!', kk(t, tJ.ojala - 0.15, 0.55), { cell: 16, bold: true, color: T.rojo, border: '#FFFFFF', textColor: '#FFFFFF', shadowColor: T.granate, rot: -0.07 + shake(t, tJ.ojala + 0.1, 0.35, 0.03), scale: s });
  for (let i = 0; i < 6; i++) { const a = i * 1.047 + t * 0.8, r = 300 + 40 * Math.sin(t * 5 + i); STAR.draw(g, 540 + Math.cos(a) * r, 850 + Math.sin(a) * r, { anchor: [0.5, 0.5], scale: 0.7, alpha: kk(t, tJ.ojala, 0.3) }); }

function sceneK(t) {   // ¿TÚ SABÍAS QUE EXISTÍA? DIME SÍ O NO
  const kp = kk(t, tK.tu + 0.05, 0.5);

  const press = (t0) => (t >= t0 && t < t0 + 0.3 ? 0.85 + 0.15 * E.outBack(kk(t, t0, 0.3)) : 1);
  const kb = kk(t, tK.dime - 0.15, 0.35);

  patch(770, 780, 'NO', kk(t, tK.dime - 0.05, 0.35), { cell: 17, bold: true, color: T.rojo, border: '#FFFFFF', textColor: '#FFFFFF', shadowColor: T.granate, shape: 'circle', rot: 0.06, scale: press(tK.no) * (1 + bump(t, tK.no, 0.35, 0.12)) });
  card(380, 1010, 560, 112, T.azul, '@maripili_62', 'SÍ, ¡y he ido!', '1.204', kk(t, tK.si + 0.15, 0.3));

function sceneL(t) {   // CIERRE: SÍGUEME + DECHADO
  if (t < tL.cada - 0.2) {     // botón SEGUIR
    const kb = kk(t, tL.sigueme - 0.15, 0.7);

    patch(740, 400, 'UN REFRÁN\nCADA DÍA', kk(t, tL.y + 0.1, 0.7), LBL('', { cell: 7, rot: 0.05 }));

    return;
  }
  // DECHADO de la colección
  const kin = E.outBack(kk(t, tL.cada - 0.2, 0.45));
  g.save(); g.translate(540, 700); g.scale(0.6 + 0.4 * kin, 0.6 + 0.4 * kin); g.rotate((1 - kin) * 0.1); g.translate(-540, -700); g.globalAlpha *= clamp(kin * 3);
  g.save(); g.shadowColor = 'rgba(40,20,5,.4)'; g.shadowBlur = 30; g.shadowOffsetY = 12; g.fillStyle = '#FBF8F1'; g.fillRect(DX - 10, DY - 10, DCH.pw + 20, DCH.ph + 20); g.restore();
  Stitch.drawFabric(g, DX - 10, DY - 10, DCH.pw + 20, DCH.ph + 20, { cell: 10, color: 'blanco', ox: DX, oy: DY });
  DCH.draw(g, DX, DY);
  // casillas ya bordadas
  for (let i = 0; i < 2; i++) { const [x, y] = boxC(i); ICONS[i].draw(g, x, y, { anchor: [0.5, 0.5], scale: 0.95 }); }
  // la Nº 3 se borda ahora
  const [x3, y3] = boxC(2);
  const k3 = kk(t, tL.otro - 0.2, 1.1);
  if (k3 > 0) {
    if (k3 >= 1) ICONS[2].draw(g, x3, y3, { anchor: [0.5, 0.5], scale: 0.95 * (1 + bump(t, tL.otro + 0.9, 0.4, 0.15)) });

  patch(x3, y3 + 84, 'Nº 3', kk(t, tL.otro + 0.7, 0.6), { cell: 5, pad: 1, color: T.rojo, border: '#FFFFFF', textColor: '#FFFFFF', shadowColor: null });
  patch(boxC(0)[0], boxC(0)[1] + 84, 'Nº 1', 1, { cell: 5, pad: 1, color: T.marino, border: '#FFFFFF', textColor: '#FFFFFF', shadowColor: null });
  patch(boxC(1)[0], boxC(1)[1] + 84, 'Nº 2', 1, { cell: 5, pad: 1, color: T.marino, border: '#FFFFFF', textColor: '#FFFFFF', shadowColor: null });
  g.restore();
  patch(650, 1070, 'sígueme para completarla', kk(t, tL.cada + 0.4, 0.9), { cell: 6, pad: 1, color: T.rojo, border: '#FFFFFF', textColor: '#FFFFFF', shadowColor: null, rot: -0.02 });
  // botón SEGUIR pequeñito junto a la abuela
  patch(560, 1200, '+ SEGUIR', 1, { cell: 6, bold: true, color: T.rojo, border: '#FFFFFF', textColor: '#FFFFFF', shadowColor: T.granate, radius: 40, scale: 1 + Math.sin(t * 6) * 0.03 });
  // el hilo de la abuela a la casilla 3, y las tijeras lo cortan
  if (HOOP && t > tL.otro - 0.2) {
    const a = [HOOP.cx + 70, HOOP.cy - 40], b = [x3, y3 + 40];

// ------------------------------------------------------------------ FOTOGRAMA
function drawScene(t) {
  if (t < tB.y) sceneA(t);
  else if (t < tC.soy - 0.02) sceneB(t);
  else if (t < tD.babia - 0.3) sceneC(t);
  else if (t < tE.en) sceneD(t);
  else if (t < tF.y) sceneE(t);
  else if (t < tG.o - 0.1) sceneF(t);
  else if (t < tH.y) sceneG(t);
  else if (t < tI.ojo - 0.1) sceneH(t);
  else if (t < tJ.hoy) sceneI(t);
  else if (t < tK.tu) sceneJ(t);
  else if (t < tL.y - 0.1) sceneK(t);
  else sceneL(t);
}
function frameMain(t) {
  CUR_T = t; FRONT.length = 0;

  Marco.yarn(g, 1000, 1700, 90, { color: T.azul, rot: 0.4, end: [[900, 1800], [760, 1760]] });
  Marco.thimble(g, 90, 1720, 90, { rot: -0.2 });
  cam(t, 540, 700, punchZ(t), () => drawScene(t));
  // la abuela (por debajo de algunas escenas el texto debe ir encima)
  drawAbuela(t);
  sceneCPull(t);
  flushFront();
  // micro-recordatorio (una vez)
  if (live(t, tC.dice + 0.7, tC.dice + 2.3)) patch(620, 1250, 'un refrán nuevo cada día', kk(t, tC.dice + 0.7, 0.5) * gone(t, tC.dice + 2.1), { cell: 5, pad: 1, color: '#FBF6EE', border: T.rojo, textColor: T.granate, shadowColor: null, rot: -0.03 });
  flushFront();
  // etiqueta de la colección
  Marco.patch(g, 250, 192, 'REFRÁN Nº 3', { k: 1, t, cell: 6, pad: 1, color: T.marino, border: T.mostaza, textColor: '#FFFFFF', shadowColor: null, rot: -0.04 });
  WIPES.forEach(([tc, kind]) => wipe(t, tc, kind));
}
window.frame = t => {
  cv.style.filter = ''; cv.style.transform = '';
  if (t >= tEnd + 0.3) {
    const k = clamp((t - tEnd - 0.3) / 1.5);

    Marco.patch(g, 250, 192, 'REFRÁN Nº 3', { k: clamp((t - tEnd - 0.6) / 0.8), t, cell: 6, pad: 1, color: T.marino, border: T.mostaza, textColor: '#FFFFFF', shadowColor: null, rot: -0.04 });
    Marco.patch(g, 540, 1460, 'Fuente: tradición popular', { k: clamp((t - tEnd - 1.3) / 0.8), t, cell: 4, pad: 1, color: '#FBF6EE', border: T.granate, textColor: T.granate, shadowColor: null });
    // bucle: vuelve a la tela crema con el refrán
    const lp = clamp((t - (DUR - 0.4)) / 0.4);
    if (lp > 0) { g.save(); g.globalAlpha = E.inOutCubic(lp); frameMain(0.02); g.restore(); }
    return;
  }
  frameMain(t);
  if (t >= tEnd) {   // cortina de vichy
    const c = E.inOutCubic(clamp((t - tEnd) / 0.35));
    g.save(); g.beginPath(); g.rect(0, 0, 1080, 1920 * c); g.clip(); Marco.drawBg(g, 'vichy'); g.restore();
    g.fillStyle = 'rgba(122,31,43,.85)'; g.fillRect(0, 1920 * c - 10, 1080, 10);
  }
  if (!rgbGlitch(t, tF.babia - 0.45) && !rgbGlitch(t, tJ.ojala)) {}
  const sk = shake(t, tF.babia - 0.45, 0.35, 10) + shake(t, tJ.ojala + 0.05, 0.35, 12) + shake(t, tA.existe + 0.05, 0.25, 6);

};
