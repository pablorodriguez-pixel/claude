<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<style>html,body{margin:0;background:#17407f}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="build/timeline.js"></script>
<script>
// Estilo "plano técnico": fondo azul con cuadrícula, línea fina blanca, acento amarillo,
// datos (HUD) arriba y subtítulos monoespaciados por palabra. Todos los dibujos son propios.
const W = 1080, H = 1920;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const easeIO = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const easeBack = x => { x = clamp(x); if (x <= 0) return 0; if (x >= 1) return 1; const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;

const C = { line: '#e8f1ff', soft: 'rgba(232,241,255,.55)', faint: 'rgba(232,241,255,.22)', label: '#9fc0f0',
            yellow: '#f6bd4b', green: '#62c9a1', red: '#ff6b6b', panel: 'rgba(255,255,255,.07)' };
const MONO = "'JetBrains Mono', 'DejaVu Sans Mono', monospace";
const fmt = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');

const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]/g, '');
const SC = {}; TL.scenes.forEach(s => SC[s.name] = s);
function wt(scene, word, nth = 0) {
  const s = SC[scene]; let k = 0;
  for (const w of s.words) if (norm(w.w) === norm(word)) { if (k++ === nth) return s.start + w.t; }
  throw new Error('palabra no encontrada: ' + scene + ':' + word + '#' + nth);
}

// ── primitivas ──
function txt(s, x, y, size, color, o = {}) {
  ctx.save(); ctx.globalAlpha *= o.alpha ?? 1; ctx.translate(x, y); if (o.scale) ctx.scale(o.scale, o.scale);
  ctx.font = `${o.weight || 700} ${size}px ${MONO}`; ctx.textAlign = o.align || 'center'; ctx.textBaseline = o.base || 'middle';
  ctx.letterSpacing = (o.ls || 0) + 'px'; ctx.fillStyle = color; ctx.fillText(s, 0, 0); ctx.restore();
}
function line(x1, y1, x2, y2, color = C.line, w = 3) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineWidth = w; ctx.strokeStyle = color; ctx.stroke(); }
function circle(x, y, r, o = {}) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); if (o.fill) { ctx.fillStyle = o.fill; ctx.fill(); } if (o.stroke !== null) { ctx.lineWidth = o.w || 3; ctx.strokeStyle = o.stroke || C.line; ctx.stroke(); } }

function bottle(x, y, w, h, color = C.line, lw = 2, fill = null) {  // (x,y) = centro superior
  const nw = w * .32, sh = h * .34;
  ctx.beginPath(); ctx.moveTo(x - nw / 2, y); ctx.lineTo(x - nw / 2, y + sh * .7); ctx.quadraticCurveTo(x - w / 2, y + sh, x - w / 2, y + sh * 1.5);
  ctx.lineTo(x - w / 2, y + h - 2); ctx.quadraticCurveTo(x - w / 2, y + h, x - w / 2 + 2, y + h); ctx.lineTo(x + w / 2 - 2, y + h);
  ctx.quadraticCurveTo(x + w / 2, y + h, x + w / 2, y + h - 2); ctx.lineTo(x + w / 2, y + sh * 1.5); ctx.quadraticCurveTo(x + w / 2, y + sh, x + nw / 2, y + sh * .7);
  ctx.lineTo(x + nw / 2, y); ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); } ctx.lineWidth = lw; ctx.lineJoin = 'round'; ctx.strokeStyle = color; ctx.stroke();
}
// persona de contorno (centro x, pie y, alto s)
function person(x, y, s, color = C.line, fill = null, lw = 3) {
  const P = [[-.20, -.26], [-.31, -.14], [-.33, .08], [-.25, .08], [-.22, -.10], [-.14, -.10], [-.14, .5], [-.02, .5], [-.02, .12], [.02, .12], [.02, .5], [.14, .5], [.14, -.10], [.22, -.10], [.25, .08], [.33, .08], [.31, -.14], [.20, -.26]];
  ctx.save(); ctx.translate(x, y - s * .5); ctx.beginPath();
  P.forEach(([a, b], i) => i ? ctx.lineTo(a * s, b * s) : ctx.moveTo(a * s, b * s)); ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); } ctx.lineWidth = lw; ctx.lineJoin = 'round'; ctx.strokeStyle = color; ctx.stroke();
  ctx.beginPath(); ctx.arc(0, -.42 * s, .13 * s, 0, Math.PI * 2); if (fill) ctx.fill(); ctx.stroke(); ctx.restore();
}
function zzz(x, y, s, t) { txt('z', x + s * .26, y - s * (.95 + .04 * Math.sin(t * 5)), s * .2, C.green, { weight: 800 }); txt('z', x + s * .38, y - s * (1.1 + .04 * Math.sin(t * 5 + 1)), s * .27, C.green, { weight: 800 }); }
function clock(cx, cy, R, ang, color = C.line) {
  circle(cx, cy, R, { w: 4 });
  for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2; line(cx + Math.sin(a) * (R - 22), cy - Math.cos(a) * (R - 22), cx + Math.sin(a) * (R - 8), cy - Math.cos(a) * (R - 8), color, 3); }
  line(cx, cy, cx + Math.sin(ang) * (R - 40), cy - Math.cos(ang) * (R - 40), C.yellow, 5); circle(cx, cy, 8, { fill: C.line, stroke: null });
}

// ── fondo con cuadrícula ──
function background() {
  const g = ctx.createRadialGradient(W / 2, H * .38, 80, W / 2, H * .45, 1300);
  g.addColorStop(0, '#2457a1'); g.addColorStop(.6, '#1a468a'); g.addColorStop(1, '#10285a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.lineWidth = 1;
  for (let x = 0; x <= W; x += 60) { ctx.strokeStyle = (x % 180 === 0) ? 'rgba(160,195,255,.16)' : 'rgba(160,195,255,.07)'; ctx.beginPath(); ctx.moveTo(x + .5, 0); ctx.lineTo(x + .5, H); ctx.stroke(); }
  for (let y = 0; y <= H; y += 60) { ctx.strokeStyle = (y % 180 === 0) ? 'rgba(160,195,255,.16)' : 'rgba(160,195,255,.07)'; ctx.beginPath(); ctx.moveTo(0, y + .5); ctx.lineTo(W, y + .5); ctx.stroke(); }
}

// ── HUD: etiqueta pequeña + cifra grande ──
function hud(side, label, value, o = {}) {
  const x = side === 'L' ? 100 : W - 100, al = side === 'L' ? 'left' : 'right', a = o.alpha ?? 1;
  txt(label, x, 252, 24, C.label, { align: al, weight: 500, ls: 3, alpha: a });
  let ux = 0;
  if (o.unit) { ctx.save(); ctx.font = `600 24px ${MONO}`; ctx.letterSpacing = '2px'; ux = ctx.measureText(o.unit).width + 14; ctx.restore(); }
  txt(value, side === 'R' ? x - ux : x, 322, o.size || 84, o.color || C.line, { align: al, weight: 800, alpha: a });
  if (o.unit) { ctx.save(); ctx.font = `800 ${o.size || 84}px ${MONO}`; const w = ctx.measureText(value).width; ctx.restore();
    txt(o.unit, side === 'L' ? x + w + 14 : x, 336, 24, C.line, { align: al, weight: 600, ls: 2, alpha: a }); }
}

// ── subtítulos por palabra ──
const CHUNKS = [];
TL.scenes.forEach(s => {
  let cur = [], len = 0;
  s.words.forEach((w, i) => {
    cur.push({ ...w, abs: s.start + w.t }); len += w.w.length + 1;
    const stop = /[.,:;?!…]$/.test(w.w) && cur.length >= 2;
    if (len > 22 || cur.length >= 4 || stop || i === s.words.length - 1) { CHUNKS.push({ words: cur, scene: s }); cur = []; len = 0; }
  });
});
function captions(t) {
  let ch = null;
  for (let i = 0; i < CHUNKS.length; i++) {
    const c = CHUNKS[i], st = c.words[0].abs;
    const en = i + 1 < CHUNKS.length && CHUNKS[i + 1].scene === c.scene ? CHUNKS[i + 1].words[0].abs : c.scene.start + c.scene.dur + .15;
    if (t >= st - .02 && t < en) { ch = c; break; }
  }
  if (!ch) return;
  const size = 62; ctx.font = `800 ${size}px ${MONO}`; ctx.letterSpacing = '0px';
  const sp = ctx.measureText(' ').width, vis = ch.words.filter(w => t >= w.abs - .02);
  const lines = [[]]; let wl = 0;
  vis.forEach(w => { const ww = ctx.measureText(w.w).width; if (wl + ww > 760 && lines[lines.length - 1].length) { lines.push([]); wl = 0; } lines[lines.length - 1].push(w); wl += ww + sp; });
  // el reparto en líneas se calcula con TODAS las palabras para que nada salte al aparecer
  const full = [[]]; wl = 0;
  ch.words.forEach(w => { const ww = ctx.measureText(w.w).width; if (wl + ww > 760 && full[full.length - 1].length) { full.push([]); wl = 0; } full[full.length - 1].push(w); wl += ww + sp; });
  full.forEach((ln, li) => {
    const widths = ln.map(w => ctx.measureText(w.w).width), tot = widths.reduce((a, b) => a + b, 0) + sp * (ln.length - 1);
    let x = W / 2 - tot / 2;
    ln.forEach((w, i) => {
      if (t >= w.abs - .02) {
        const act = t < w.abs + Math.max(w.d, .22), a = easeOut(seg(t, w.abs - .02, w.abs + .08));
        txt(w.w, x, 1366 + li * 78 + (1 - a) * 8, size, act ? C.yellow : C.line, { align: 'left', weight: 800, alpha: a });
      }
      x += widths[i] + sp;
    });
  });
}

// ── rejilla de botellas ──
function bottleGrid(n, cols, x0, y0, cw, ch, alphaFn, colorFn) {
  const bw = cw * .5, bh = ch * .85;
  for (let i = 0; i < n; i++) {
    const a = alphaFn(i); if (a <= 0.01) continue;
    const col = i % cols, row = Math.floor(i / cols);
    ctx.save(); ctx.globalAlpha *= a; bottle(x0 + col * cw + cw / 2, y0 + row * ch, bw, bh, colorFn ? colorFn(i) : C.line, 1.4); ctx.restore();
  }
}
const GX = 214, GY = 400, GCW = 16.35, GCH = 26;
const bitCount = k => { let c = 0; for (let n = 1; n <= 1000; n++) if (((n - 1) >> (k - 1)) & 1) c++; return c; };

// ── escenas ──
function sceneHook(t, lt, s) {
  const tEx = wt('hook', 'exactamente'), tUna = wt('hook', 'una', 0);
  hud('L', 'BOTELLAS', '1.000', { alpha: seg(lt, .1, .5) });
  const P = 12 * 40 + 8, ring = easeBack(seg(t, tEx, tEx + .5));
  bottleGrid(1000, 40, GX, GY, GCW, GCH, i => easeOut(seg(lt, .25 + Math.floor(i / 40) * .06 + (i % 40) * .004, .55 + Math.floor(i / 40) * .06 + (i % 40) * .004)),
    i => (i === P && ring > 0) ? C.yellow : C.line);
  if (ring > 0) { const cx = GX + 8 * GCW + GCW / 2, cy = GY + 12 * GCH + 11;
    circle(cx, cy, 24 * ring, { stroke: C.yellow, w: 3 });
    const ph = ((t - tEx) * .9) % 1; ctx.save(); ctx.globalAlpha *= (1 - ph) * .6; circle(cx, cy, 24 + ph * 60, { stroke: C.yellow, w: 2 }); ctx.restore(); }
}

function scenePlazo(t, lt, s) {
  const tH = wt('plazo', 'hora'), tV = wt('plazo', 'veinticuatro');
  hud('L', 'EL VENENO TARDA', '1', { alpha: seg(t, tH - .1, tH + .3), unit: 'HORA' });
  const f = seg(t, tV - .1, tV + .3);
  hud('R', 'LA FIESTA EMPIEZA EN', '24', { alpha: f, color: C.yellow, unit: 'HORAS' });
  const cx = W / 2, cy = 830, a = easeOut(seg(lt, .1, .6));
  ctx.save(); ctx.globalAlpha *= a;
  // mesa con botellas
  line(250, 1090, 830, 1090, C.line, 4); line(280, 1090, 260, 1230, C.soft, 3); line(800, 1090, 820, 1230, C.soft, 3);
  [0, 1, 2].forEach(i => bottle(340 + i * 44, 1000, 30, 90, C.line, 3));
  const ang = (t - tH) > 0 ? easeIO(seg(t, tH, tH + 1.4)) * Math.PI * 2 + (t - tV > 0 ? seg(t, tV, tV + 2.2) * Math.PI * 2 * 3 : 0) : 0;
  clock(cx, cy, 200, ang);
  ctx.restore();
  txt('24 H', cx, cy + 90, 40, C.yellow, { alpha: f, weight: 800, ls: 4 });
}

function peopleRow(n, x0, dx, y, s, t0, o = {}) {
  for (let i = 0; i < n; i++) {
    const a = easeOut(seg(o.t, t0 + i * (o.step || .12), t0 + i * (o.step || .12) + .3)); if (a <= 0) continue;
    const col = o.color ? o.color(i) : C.line;
    ctx.save(); ctx.globalAlpha *= a; person(x0 + i * dx, y, s, col, null, o.lw || 3);
    txt(o.label ? o.label(i) : String(i + 1), x0 + i * dx, y + 34, 24, col === C.line ? C.label : col, { weight: 700 }); ctx.restore();
  }
}
function dimGrid(lt, a = .32) { bottleGrid(1000, 40, GX, GY, GCW, GCH, () => a); }

function sceneReto(t, lt, s) {
  const tN = wt('reto', 'necesitas'), tC = wt('reto', 'catadores'), tR = wt('reto', 'ronda');
  hud('L', 'BOTELLAS', '1.000', {});
  const q = seg(t, tC - .1, tC + .3);
  hud('R', 'CATADORES', '?', { alpha: q, color: C.yellow });
  dimGrid(lt);
  peopleRow(7, 240, 100, 1190, 96, tC, { t, step: .16, lw: 3 });
  txt('1 RONDA', W / 2, 1000, 44, C.yellow, { alpha: easeOut(seg(t, tR - .1, tR + .3)) * (1 - seg(t, tN, tN + .2)), weight: 800, ls: 6 });
}

function sceneObvio(t, lt, s) {
  const tC = wt('obvio', 'cientos'), tD = wt('obvio', 'diez');
  hud('L', 'BOTELLAS', '1.000', {});
  const kill = easeOut(seg(t, tC + .5, tC + .8)), ten = seg(t, tD - .05, tD + .25);
  hud('R', 'CATADORES', ten > 0 ? '10' : '500', { color: ten > 0 ? C.yellow : C.line, alpha: seg(t, tC - .1, tC + .25) });
  if (kill > 0 && ten <= 0) { ctx.save(); ctx.strokeStyle = C.red; ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(W - 330, 345); ctx.lineTo(W - 330 + 230 * kill, 300 + 45 * (1 - kill)); ctx.stroke(); ctx.restore(); }
  dimGrid(lt);
  peopleRow(10, 135, 90, 1190, 84, tD, { t, step: .1, color: () => C.yellow, lw: 3 });
}

const BX = i => 390 + i * 150;
function miniBase(t, lt, o = {}) {
  hud('L', 'BOTELLAS', '4', { alpha: seg(lt, .05, .4) }); hud('R', 'CATADORES', '2', { alpha: seg(lt, .05, .4) });
  const hi = o.hi ?? -1;
  for (let i = 0; i < 4; i++) {
    const a = easeOut(seg(lt, .15 + i * .1, .5 + i * .1)); if (a <= 0) continue;
    ctx.save(); ctx.globalAlpha *= a;
    const on = i === hi;
    if (on) { ctx.fillStyle = 'rgba(246,189,75,.14)'; ctx.fillRect(BX(i) - 60, 470, 120, 640); }
    bottle(BX(i), 520, 62, 128, on ? C.yellow : C.line, 3);
    txt(String(i + 1), BX(i), 700, 34, on ? C.yellow : C.label, { weight: 800 });
    ctx.restore();
  }
}
function toggles(t, lt, fills, o = {}) { // fills: [ana[4], beto[4]] valores 0..1
  const rows = [['ANA', 880], ['BETO', 1030]];
  rows.forEach(([name, y], r) => {
    const a = easeOut(seg(lt, .5 + r * .15, .9 + r * .15)); if (a <= 0) return;
    ctx.save(); ctx.globalAlpha *= a;
    const sick = o.sick && o.sick[r];
    person(185, y + 52, 110, sick ? C.green : C.line, sick ? 'rgba(98,201,161,.5)' : null, 3);
    if (sick) zzz(185, y + 52, 110, t);
    txt(name, 250, y + 20, 24, sick ? C.green : C.label, { align: 'left', weight: 700, ls: 2 });
    for (let i = 0; i < 4; i++) {
      circle(BX(i), y, 30, { stroke: C.line, w: 3 });
      const f = fills[r][i]; if (f > 0) circle(BX(i), y, 16 * f, { fill: C.line, stroke: null });
    }
    ctx.restore();
  });
}
function sceneMini(t, lt, s) { miniBase(t, lt); toggles(t, lt, [[0, 0, 0, 0], [0, 0, 0, 0]]); }
function sceneReglas(t, lt, s) {
  const f = e => easeBack(seg(t, e, e + .3));
  const A = [0, f(wt('reglas', 'dos')), 0, f(wt('reglas', 'cuatro', 0))], Bt = [0, 0, f(wt('reglas', 'tres')), f(wt('reglas', 'cuatro', 1))];
  miniBase(t, lt); toggles(t, lt, [A, Bt]);
}
function sceneLecturas(t, lt, s) {
  const anchors = [[wt('lecturas', 'nadie'), wt('lecturas', 'uno', 0)], [wt('lecturas', 'ana', 0), wt('lecturas', 'dos', 0)], [wt('lecturas', 'beto', 0), wt('lecturas', 'tres')], [wt('lecturas', 'enferman'), wt('lecturas', 'cuatro')]];
  let k = -1, res = false; anchors.forEach(([a, r], i) => { if (t >= a - .05) { k = i; res = t >= r - .05; } });
  const sick = k < 0 ? [0, 0] : [k & 1, (k >> 1) & 1];
  miniBase(t, lt, { hi: res ? k : -1 });
  const fills = [0, 1].map(r => [0, 1, 2, 3].map(i => ((i >> r) & 1) ? 1 : 0));
  toggles(t, lt, fills, { sick });
  if (k >= 0) txt(['NADIE ENFERMA', 'ENFERMA ANA', 'ENFERMA BETO', 'ENFERMAN LOS DOS'][k], W / 2, 1190, 40, k < 0 ? C.line : C.green, { weight: 800, ls: 3 });
  if (res) txt(`→ BOTELLA ${k + 1}`, W / 2, 1270, 54, C.yellow, { weight: 800, scale: .9 + .1 * easeBack(seg(t, anchors[k][1] - .05, anchors[k][1] + .3)) });
}

function sceneDobla(t, lt, s) {
  const t3 = wt('dobla', 'tres'), t4 = wt('dobla', 'cuatro'), tB = wt('dobla', 'binario');
  const stage = t >= t4 ? 4 : t >= t3 ? 3 : 2, n = 1 << stage;
  const stT = stage === 4 ? t4 : stage === 3 ? t3 : s.start;
  hud('L', 'COMBINACIONES', String(n), { color: C.yellow });
  hud('R', 'CATADORES', String(stage));
  const cols = 8, dx = 110, y0 = 540, dy = 190, x0 = W / 2 - (Math.min(n, 8) - 1) * dx / 2;
  for (let i = 0; i < 16; i++) {
    if (i >= n) continue;
    const born = i >= (n >> 1) ? stT : s.start - 1, a = easeOut(seg(t, born + .05 + (i - (n >> 1)) * .05, born + .4 + (i - (n >> 1)) * .05));
    const col = i % cols, row = Math.floor(i / cols), nw = i >= (n >> 1) && stage > 2;
    ctx.save(); ctx.globalAlpha *= (i < 4 ? easeOut(seg(lt, .1 + i * .08, .5 + i * .08)) : a);
    bottle(x0 + col * dx, y0 + row * dy, 56, 118, nw && t < born + 1.2 ? C.yellow : C.line, 3);
    ctx.restore();
  }
  if (t >= tB) txt('×2', W / 2, 1060, 96, C.yellow, { alpha: .9, weight: 800, scale: 1 + .08 * Math.sin(Math.max(0, t - stT) * 3) * Math.exp(-(t - stT)) });
  peopleRow(stage, W / 2 - (stage - 1) * 50, 100, 1220, 80, s.start, { t, step: 0, color: i => i === stage - 1 && stage > 2 ? C.yellow : C.line });
}

function sceneDiez(t, lt, s) {
  const tD = wt('diez', 'diez'), tQ = wt('diez', 'quinientas'), tR = wt('diez', 'ronda'), tM = wt('diez', 'mil');
  const period = .62, cyc = Math.floor(clamp((t - tQ) / period, 0, 9.99)), k = t >= tQ ? cyc + 1 : 0;
  hud('L', 'COMBINACIONES', fmt(1024 * easeOut(seg(t, tM - .2, tM + .6)) || 1000), { alpha: seg(lt, .05, .4) });
  hud('R', k ? `EL CATADOR ${k} PRUEBA` : 'CATADORES', k ? String(bitCount(k)) : '10', { color: k ? C.yellow : C.line, size: 84 });
  bottleGrid(1000, 40, GX, GY, GCW, GCH, () => easeOut(seg(lt, .1, .5)) * (k ? .45 : 1),
    () => C.line);
  if (k) bottleGrid(1000, 40, GX, GY, GCW, GCH, i => ((i >> (k - 1)) & 1) ? 1 : 0, () => C.yellow);
  peopleRow(10, 135, 90, 1190, 84, tD, { t, step: .08, color: i => (i + 1 === k) ? C.yellow : C.line });
  const rr = easeBack(seg(t, tR - .05, tR + .4));
  if (rr > 0) txt('1 RONDA → 1 BOTELLA', W / 2, 1290, 46, C.yellow, { weight: 800, ls: 3, scale: rr });
}

function sceneVeinte(t, lt, s) {
  const tV = wt('veinte', 'veinte');
  const e = easeIO(seg(t, tV, tV + 1.6));
  hud('L', 'BOTELLAS', fmt(lerp(1024, 1048576, e)), { color: e > .02 ? C.yellow : C.line });
  hud('R', 'CATADORES', String(Math.round(lerp(10, 20, easeOut(seg(t, tV, tV + .8))))));
  const a = easeOut(seg(lt, .1, .6));
  ctx.save(); ctx.globalAlpha *= a;
  ctx.fillStyle = 'rgba(255,255,255,.08)'; ctx.fillRect(280, 430, 520, 600); ctx.strokeStyle = C.soft; ctx.lineWidth = 3; ctx.strokeRect(280, 430, 520, 600);
  ctx.beginPath(); for (let x = 280; x <= 800; x += 13) { ctx.moveTo(x, 430); ctx.lineTo(x, 1030); } for (let y = 430; y <= 1030; y += 15) { ctx.moveTo(280, y); ctx.lineTo(800, y); }
  ctx.strokeStyle = 'rgba(232,241,255,.16)'; ctx.lineWidth = 1; ctx.stroke();
  const px = 330 + 50 * 7 + 11, py = 800, r = easeBack(seg(t, tV + 1.2, tV + 1.7));
  circle(px, py, 14 * r, { stroke: C.yellow, w: 3 }); circle(px, py, 4, { fill: C.yellow, stroke: null });
  ctx.restore();
  const n = Math.round(lerp(10, 20, easeOut(seg(t, tV, tV + .8))));

}

function sceneCta(t, lt, s) {
  const tS = wt('cta', 'sigue'), p = easeBack(seg(lt, 0, .5));

}
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

const DRAW = { hook: sceneHook, plazo: scenePlazo, reto: sceneReto, obvio: sceneObvio, mini: sceneMini, reglas: sceneReglas, lecturas: sceneLecturas, dobla: sceneDobla, diez: sceneDiez, veinte: sceneVeinte, cta: sceneCta };

function render(t) {
