<style>
  body { background: var(--fz-white); }
  .kit-nav {
    position: sticky; top: 0; z-index: 50;
    display: flex; gap: 4px; align-items: center;
    padding: 10px 16px; background: rgba(255,255,255,.85);
    backdrop-filter: blur(10px); border-bottom: 1px solid var(--fz-border);
  }
  .kit-nav .brand { display:flex; margin-right: auto; color: var(--fz-black); }
  .kit-tab {
    font-family: var(--font-display); font-size: 15px; color: var(--fz-black-70);

<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="SiteChrome.jsx"></script>
<script type="text/babel" src="Home.jsx"></script>
<script type="text/babel" src="ProgramLP.jsx"></script>
<script type="text/babel" src="Empresas.jsx"></script>
<script type="text/babel" src="Pricing.jsx"></script>
<script type="text/babel" src="Webinar.jsx"></script>
<script type="text/babel" src="BakerClon.jsx"></script>
<script type="text/babel">
  const { useState } = React;
  const { Logo } = window.FounderzDesignSystem_47078d;
  const SCREENS = {
    home: { label: "Home", C: window.Home },
    programa: { label: "Programa", C: window.ProgramLP },
    empresas: { label: "Empresas", C: window.Empresas },
    pricing: { label: "Pricing", C: window.Pricing },
    webinar: { label: "Webinar", C: window.Webinar },
    baker: { label: "Baker clon", C: window.BakerClon },
  };
  function App() {
    // Pantalla por URL hash (p. ej. #home), por defecto el webinar.
    // Sin barra de navegación: la landing empieza con su cabecera (logo + fecha).
    const hash = (window.location.hash || "").replace("#", "");
    const initial = SCREENS[hash] ? hash : "baker";
    const [tab] = useState(initial);
    const Active = SCREENS[tab].C;
    return (
      <div>
        <Active />
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
