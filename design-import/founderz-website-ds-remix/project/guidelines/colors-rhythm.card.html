<!-- @dsCard group="Colors" viewport="700x120" name="Section background rhythm" subtitle="white → grey → black → white → lilac → purple" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;background:#fff;font-family:var(--font-display)}
  .seq{display:flex;border-radius:12px;overflow:hidden;border:1px solid var(--fz-border)}
  .seg{flex:1;height:64px;display:flex;align-items:flex-end;padding:8px;font-size:11px}
</style></head>
<body>
<div class="seq">
  <div class="seg" style="background:var(--fz-white);color:var(--fz-black)">white</div>
  <div class="seg" style="background:var(--fz-grey);color:var(--fz-black)">grey</div>
  <div class="seg" style="background:var(--fz-black);color:#fff">black</div>
  <div class="seg" style="background:var(--fz-white);color:var(--fz-black)">white</div>
  <div class="seg" style="background:var(--fz-lilac);color:var(--fz-black)">lilac</div>
  <div class="seg" style="background:var(--fz-purple);color:#fff">purple</div>
</div>
</body></html>
