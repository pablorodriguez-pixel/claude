<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:24px;background:#fff;font-family:var(--font-display)}
  .row{display:flex;align-items:flex-end;gap:16px}
  .col{display:flex;flex-direction:column;align-items:center;gap:8px}
  .bar{background:var(--fz-purple);border-radius:4px;width:28px}
  .n{font-size:12px;color:var(--fz-black-70)}
</style></head>
<body>
<div class="row">
  <div class="col"><div class="bar" style="height:8px"></div><span class="n">8</span></div>
  <div class="col"><div class="bar" style="height:16px"></div><span class="n">16</span></div>
  <div class="col"><div class="bar" style="height:24px"></div><span class="n">24</span></div>
  <div class="col"><div class="bar" style="height:32px"></div><span class="n">32</span></div>
  <div class="col"><div class="bar" style="height:40px"></div><span class="n">40</span></div>
  <div class="col"><div class="bar" style="height:56px"></div><span class="n">56</span></div>
  <div class="col"><div class="bar" style="height:80px"></div><span class="n">80</span></div>
  <div class="col"><div class="bar" style="height:120px"></div><span class="n">120</span></div>
</div>
</body></html>
