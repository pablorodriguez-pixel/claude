<!-- @dsCard group="Spacing" viewport="700x170" name="Radius scale" subtitle="pill 100 · card 24 · inner 16 · faq 10 · input 8" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:24px;background:#fff;font-family:var(--font-display)}
  .row{display:flex;gap:18px;flex-wrap:wrap}
  .col{display:flex;flex-direction:column;align-items:center;gap:8px}
  .box{width:84px;height:64px;background:var(--fz-lilac);border:1px solid var(--fz-border)}
  .n{font-size:12px;color:var(--fz-black-70)}
</style></head>
<body>
<div class="row">
  <div class="col"><div class="box" style="border-radius:var(--radius-input)"></div><span class="n">input · 8</span></div>
  <div class="col"><div class="box" style="border-radius:var(--radius-faq)"></div><span class="n">faq · 10</span></div>
  <div class="col"><div class="box" style="border-radius:var(--radius-card-inner)"></div><span class="n">inner · 16</span></div>
  <div class="col"><div class="box" style="border-radius:var(--radius-section)"></div><span class="n">section · 20</span></div>
  <div class="col"><div class="box" style="border-radius:var(--radius-card)"></div><span class="n">card · 24</span></div>
  <div class="col"><div class="box" style="border-radius:var(--radius-pill);width:120px"></div><span class="n">pill · 100</span></div>
</div>
</body></html>
