<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;background:#fff;font-family:var(--font-display)}
  .row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .sw{border-radius:12px;border:1px solid var(--fz-border);overflow:hidden}
  .chip{height:72px}
  .meta{padding:10px 12px}
  .name{font-size:14px;font-weight:600;color:var(--fz-black)}
  .hex{font-size:13px;color:var(--fz-black-70);text-transform:uppercase}
</style></head>
<body>
<div class="row">
  <div class="sw"><div class="chip" style="background:var(--fz-grey)"></div><div class="meta"><div class="name">Grey</div><div class="hex">#f3f5f7</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--fz-lilac)"></div><div class="meta"><div class="name">Lilac</div><div class="hex">#e2e2f8</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--fz-lilac-deep)"></div><div class="meta"><div class="name">Lilac deep</div><div class="hex">#dcdceb</div></div></div>
</div>
</body></html>
