<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;background:#fff;font-family:var(--font-display)}
  .row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .sw{border-radius:12px;border:1px solid var(--fz-border);overflow:hidden}
  .chip{height:72px}
  .meta{padding:10px 12px}
  .name{font-size:14px;font-weight:600;color:var(--fz-black)}
  .hex{font-size:13px;color:var(--fz-black-70);text-transform:uppercase}
</style></head>
<body>
<div class="row">
  <div class="sw"><div class="chip" style="background:var(--fz-purple)"></div><div class="meta"><div class="name">Purple</div><div class="hex">#5045c8</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--fz-violet-darker)"></div><div class="meta"><div class="name">Violet darker</div><div class="hex">#2f2976</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--fz-black)"></div><div class="meta"><div class="name">Black</div><div class="hex">#1a191d</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--fz-white)"></div><div class="meta"><div class="name">White</div><div class="hex">#ffffff</div></div></div>
</div>
</body></html>
