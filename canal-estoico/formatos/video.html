#lock .clock{position:absolute;left:0;right:0;top:300px;text-align:center;font-size:300px;font-weight:800;letter-spacing:-8px;line-height:1}
#lock .clock.late{color:#ff5a4e}
.card{position:absolute;left:70px;right:70px;border-radius:44px;background:rgba(40,44,52,.82);backdrop-filter:blur(20px);box-shadow:0 20px 60px rgba(0,0,0,.45)}
#alarm{top:720px;padding:40px 46px}
#alarm .t{font-size:36px;color:rgba(244,241,234,.6);font-weight:600}
#alarm .h{font-size:76px;font-weight:800;margin-top:6px}
#alarm .btns{display:flex;gap:26px;margin-top:34px}
#alarm .b{flex:1;text-align:center;padding:30px 0;border-radius:100px;font-size:44px;font-weight:800;background:rgba(255,255,255,.12)}
#alarm .b.snooze{background:#f2a63b;color:#1a1308;position:relative}
#alarm .b.stop{background:rgba(255,255,255,.14)}
#alarm .x{position:absolute;left:-10px;right:-10px;top:50%;height:10px;margin-top:-5px;background:#ff5a4e;border-radius:6px;transform-origin:left;transform:scaleX(0) rotate(-6deg)}
.notif{position:absolute;left:70px;right:70px;height:150px;border-radius:38px;background:rgba(44,48,58,.92);display:flex;align-items:center;gap:28px;padding:0 34px;box-shadow:0 14px 40px rgba(0,0,0,.4)}
.notif i{width:86px;height:86px;border-radius:22px;flex:none}
.notif b{display:block;font-size:36px;font-weight:800}
.notif span{display:block;font-size:32px;color:rgba(244,241,234,.65);margin-top:4px}

#rome{background:radial-gradient(ellipse at 50% 40%,#3a3127 0%,#14110d 70%)}

#rome .sub{position:absolute;left:0;right:0;top:265px;text-align:center;font-family:Cinzel,serif;font-size:36px;letter-spacing:.35em;color:rgba(244,241,234,.8)}

#notes .cur{display:inline-block;width:6px;height:100px;background:#c48a2c;vertical-align:-14px;margin-left:6px}
